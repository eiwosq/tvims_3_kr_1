ne{AB}$ - д) $\\varnothing$"},{"id":"tvims3-017","no":2,"source":"Учебник · Практика · §1 · Контрольные задачи","group":"Контрольные задачи","raw":"Из всех зарегистрированных в России в 2010 году супружеских пар выбирают одну. Рассмотрим события:\n\n$A=\\{\\text{мужу меньше 30 лет}\\}$,\n$B=\\{\\text{муж старше жены}\\}$,\n$C=\\{\\text{жене больше 30 лет}\\}$.\n\nКакое из следующих утверждений справедливо?\n\n- а) $A\\overline C\\subset B$\n- б) $\\overline A+\\overline B=C$\n- в) $C\\overline B\\subset A$\n- г) $\\overline A C=\\Omega\\setminus B$\n- д) $AC\\subset\\overline B$\n- е) $A\\overline B\\subset\\overline C$","html":"\u003cp\u003eИз всех зарегистрированных в России в 2010 году супружеских пар выбирают одну. Рассмотрим события:\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"math\"\u003e\\(A=\\{\\text{мужу меньше 30 лет}\\}\\)\u003c/span\u003e,\n\u003cspan class=\"math\"\u003e\\(B=\\{\\text{муж старше жены}\\}\\)\u003c/span\u003e,\n\u003cspan class=\"math\"\u003e\\(C=\\{\\text{жене больше 30 лет}\\}\\)\u003c/span\u003e.\u003c/p\u003e\n\u003cp\u003eКакое из следующих утверждений справедливо?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eа) \u003cspan class=\"math\"\u003e\\(A\\overline C\\subset B\\)\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eб) \u003cspan class=\"math\"\u003e\\(\\overline A+\\overline B=C\\)\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eв) \u003cspan class=\"math\"\u003e\\(C\\overline B\\subset A\\)\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eг) \u003cspan class=\"math\"\u003e\\(\\overline A C=\\Omega\\setminus B\\)\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eд) \u003cspan class=\"math\"\u003e\\(AC\\subset\\overline B\\)\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eе) \u003cspan class=\"math\"\u003e\\(A\\overline B\\subset\\overline C\\)\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n","text":"Из всех зарегистрированных в России в 2010 году супружеских пар выбирают одну. Рассмотрим события: $A=\\{\\text{мужу меньше 30 лет}\\}$, $B=\\{\\text{муж старше жены}\\}$, $C=\\{\\text{жене больше 30 лет}\\}$. Какое из следующих утверждений справедливо? - а) $A\\overline C\\subset B$ - б) $\\overline A+\\overline B=C$ - в) $C\\overline B\\subset A$ - г) $\\overline A C=\\Omega\\setminus B$ - д) $AC\\subset\\overline B$ - е) $A\\overline B\\subset\\overline C$"},{"id":"tvims3-018","no":3,"source":"Учебник · Практика · §1 · Контрольные задачи","group":"Контрольные задачи","raw":"Хозяйка приобрела два пакетика семян кабачков и замочила их для проращивания в одном блюде. В первом пакетике было 6 семян сорта «Элит», а во втором 6 семян сорта «Best». Проросли все семена. На грядке оказалось 6 посадочных мест. Хозяйка выбрала случайным образом 6 семян для посадки. Найти вероятность того, что на грядке вырастет равное количество кабачков обоих сортов.","html":"\u003cp\u003eХозяйка приобрела два пакетика семян кабачков и замочила их для проращивания в одном блюде. В первом пакетике было 6 семян сорта «Элит», а во втором 6 семян сорта «Best». Проросли все семена. На грядке оказалось 6 посадочных мест. Хозяйка выбрала случайным образом 6 семян для посадки. Найти вероятность того, что на грядке вырастет равное количество кабачков обоих сортов.\u003c/p\u003e\n","text":"Хозяйка приобрела два пакетика семян кабачков и замочила их для проращивания в одном блюде. В первом пакетике было 6 семян сорта «Элит», а во втором 6 семян сорта «Best». Проросли все семена. На грядке оказалось 6 посадочных мест. Хозяйка выбрала случайным образом 6 семян для посадки. Найти вероятность того, что на грядке вырастет равное количество кабачков обоих сортов."},{"id":"tvims3-019","no":4,"source":"Учебник · Практика · §1 · Контрольные задачи","group":"Контрольные задачи","raw":"У любителя музыки в машине 8 дисков, среди которых 2 любимых. Он вставил все 8 дисков в проигрыватель. Найти вероятность того, что первыми окажутся 2 любимых диска.","html":"\u003cp\u003eУ любителя музыки в машине 8 дисков, среди которых 2 любимых. Он вставил в стны, и $P(A)=0{,}1$, $P(B)=0{,}4$. Найти $P(\\overline A\\cdot\\overline B)$.","html":"\u003cp\u003eИзвестно, что события \u003cspan class=\"math\"\u003e\\(A\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(B\\)\u003c/span\u003e несовместны, и \u003cspan class=\"math\"\u003e\\(P(A)=0{,}1\\)\u003c/span\u003e, \u003cspan class=\"math\"\u003e\\(P(B)=0{,}4\\)\u003c/span\u003e. Найти \u003cspan class=\"math\"\u003e\\(P(\\overline A\\cdot\\overline B)\\)\u003c/span\u003e.\u003c/p\u003e\n","text":"Известно, что события $A$ и $B$ несовместны, и $P(A)=0{,}1$, $P(B)=0{,}4$. Найти $P(\\overline A\\cdot\\overline B)$."},{"id":"tvims3-025","no":10,"source":"Учебник · Практика · §1 · Контрольные задачи","group":"Контрольные задачи","raw":"События $A_1,\\ldots,A_6$ являются несовместными, равновероятными и образуют полную группу событий. Найти $P(\\overline{A_1+A_2+A_3})$.","html":"\u003cp\u003eСобытия \u003cspan class=\"math\"\u003e\\(A_1,\\ldots,A_6\\)\u003c/span\u003e являются несовместными, равновероятными и образуют полную группу событий. Найти \u003cspan class=\"math\"\u003e\\(P(\\overline{A_1+A_2+A_3})\\)\u003c/span\u003e.\u003c/p\u003e\n","text":"События $A_1,\\ldots,A_6$ являются несовместными, равновероятными и образуют полную группу событий. Найти $P(\\overline{A_1+A_2+A_3})$."},{"id":"tvims3-026","no":1,"source":"Учебник · Практика · §3 · Тестовые задачи","group":"Тестовые задачи","raw":"Известно, что $P(A)=0{,}4$, $P(B)=0{,}8$. События $A$ и $B$ независимы. Найти $P(A+B)$.","html":"\u003cp\u003eИзвестно, что \u003cspan class=\"math\"\u003e\\(P(A)=0{,}4\\)\u003c/span\u003e, \u003cspan class=\"math\"\u003e\\(P(B)=0{,}8\\)\u003c/span\u003e. События \u003cspan class=\"math\"\u003e\\(A\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(B\\)\u003c/span\u003e независимы. Найти \u003cspan class=\"math\"\u003e\\(P(A+B)\\)\u003c/span\u003e.\u003c/p\u003e\n","text":"Известно, что $P(A)=0{,}4$, $P(B)=0{,}8$. События $A$ и $B$ независимы. Найти $P(A+B)$."},{"id":"tvims3-027","no":2,"source":"Учебник · Практика · §3 · Тестовые задачи","group":"Тестовые задачи","raw":"Известно, что $P(A)=0{,}9$, $P(B)=0{,}1$. События $A$ и $B$ несовместны. Найти $P(AB)$.","html":"\u003cp\u003eИзвестно, что \u003cspan class=\"math\"\u003e\\(P(A)=0{,}9\\)\u003c/span\u003e, \u003cspan class=\"math\"\u003e\\(P(B)=0{,}1\\)\u003c/span\u003e. События \u003cspan class=\"math\"\u003e\\(A\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(B\\)\u003c/span\u003e несовместны. Найти \u003cspan class=\"math\"\u003e\\(P(AB)\\)\u003c/span\u003e.\u003c/p\u003e\n","text":"Известно, что $P(A)=0{,}9$, $P(B)=0{,}1$. События $A$ и $B$ несовместны. Найти $P(AB)$."},{"id":"tvims3-028","no":3,"source":"Учебник · Практика · §3 · Тестовые задачи","group":"Тестовые задачи","raw":"Некоторое устройство состоит из двух параллельно соединённых блоков и перестаёт функционировать тогда, когда отказывают оба блока. Блоки могут отказывать независимо друг от друга. Вероятности безотказной работы блоков в течение времени $t$ равны соответственно $0{,}7$ и $0{,}6$. Найти вероятность того, что устройство не откажет в течение времени $t$.","html":"\u003cp\u003eНекоторое устройство состоит из двух параллельно соединённых блоков и перестаёт функционировать тогда, когда отказывают оба блока. Блоки могут отказывать независимо друг от друга. Вероятности безотказной работы блоков в течение времени \u003cspan class=\"math\"\u003e\\(t\\)\u003c/span\u003e равны соответственно \u003cspan class=\"math\"\u003e\\(0{,}7\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(0{,}6\\)\u003c/span\u003e. Найти вероятность того, что устройство не откажет в течение времени \u003cspan class=\"math\"\u003e\\(t\\)\u003c/span\u003e.\u003c/p\u003e\n","text":"Некоторое устройство состоит из двух параллельно соединённых блоков и перестаёт функционировать тогда, когда отказывают оба блока. Блоки могут отказывать независимо друг от друга. Вероятности безотказной работы блоков в течение времени $t$ равны соответственно $0{,}7$ и $0{,}6$. Найти вероятность того, что устройство не откажет в течение времени $t$."},{"id":"tvims3-029","no":4,"source":"Учебник · Практика · §3 · Тестовые задачи","group":"Тестовые задачи","raw":"Монету подбросили 7 раз. Найти вероятность того, что герб появится ровно 2 раза.","html":"\u003cp\u003eМонету подбросили 7 раз. Найти вероятность того, что герб появится ровно 2 раза.\u003c/p\u003e\n","text":"Монету подбросили 7 раз. Найти вероятность того, что герб появится ровно 2 раза."},{"id":"tvims3-030","no":5,"source":"Учебник · Практика · §3 · Тестовые задачи","group":"Тестовые задачи","raw":"События $H_1,\\ldots,H_5$ образуют систему равновероятных гипотез. Произошло событие $A=H_1+H_4$. Найти апостериорную вероятность 2-й гипотезы.","html":"\u003cp\u003eСобытия \u003cspan class=\"math\"\u003e\\(H_1,\\ldots,H_5\\)\u003c/span\u003e образуют систему равновероятных гипотез. Произошло событие \u003cspan class=\"math\"\u003e\\(A=H_1+H_4\\)\u003c/span\u003e. Найти апостериорную вероятность 2-й гипотезы.\u003c/p\u003e\n","text":"События $H_1,\\ldots,H_5$ образуют систему равновероятных гипотез. Произошло событие $A=H_1+H_4$. Найти апостериорную вероятность 2-й гипотезы."},{"id":"tvims3-031","no":6,"source":"Учебник · Практика · §3 · Тестовые задачи","group":"Тестовые задачи","raw":"События $H_1,\\ldots,H_{14}$ образуют систему равновероятных гипотез. Найти $P(H_1+H_3)$.","html":"\u003cp\u003eСобытия \u003cspan class=\"math\"\u003e\\(H_1,\\ldots,H_{14}\\)\u003c/span\u003e образуют систему равновероятных гипотез. Найти \u003cspan class=\"math\"\u003e\\(P(H_1+H_3)\\)\u003c/span\u003e.\u003c/p\u003e\n","text":"События $H_1,\\ldots,H_{14}$ образуют систему равновероятных гипотез. Найти $P(H_1+H_3)$."},{"id":"tvims3-032","no":7,"source":"Учебник · Практика · §3 · Тестовые задачи","group":"Тестовые задачи","raw":"Две партии изделий, содержащие равное их количество, находятся в одном ящике. Первая партия в среднем содержит 10 процентов брака, вторая 30 процентов. Найти вероятность того, что выбранное изделие окажется бракованным.","html":"\u003cp\u003eДве партии изделий, содержащие равное их количество, находятся в одном ящике. Первая партия в среднем содержит 10 процентов брака, вторая 30 процентов. Найти вероятность того, что выбранное изделие окажется бракованным.\u003c/p\u003e\n","text":"Две партии изделий, содержащие равное их количество, находятся в одном ящике. Первая партия в среднем содержит 10 процентов брака, вторая 30 процентов. Найти вероятность того, что выбранное изделие окажется бракованным."},{"id":"tvims3-033","no":8,"source":"Учебник · Практика · §3 · Тестовые задачи","group":"Тестовые задачи","raw":"Два опыта проводятся по схеме Бернулли. Вероятность «успеха» в одном опыте равна $0{,}5$. Каково наиболее вероятное число успехов?\n\n- а) $0$\n- б) $1$\n- в) $2$","html":"\u003cp\u003eДва опыта проводятся по схеме Бернулли. Вероятность «успеха» в одном опыте равна \u003cspan class=\"math\"\u003e\\(0{,}5\\)\u003c/span\u003e. Каково наиболее вероятное число успехов?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eа) \u003cspan class=\"math\"\u003e\\(0\\)\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eб) \u003cspan class=\"math\"\u003e\\(1\\)\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003eв) \u003cspan class=\"math\"\u003e\\(2\\)\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n","text":"Два опыта проводятся по схеме Бернулли. Вероятность «успеха» в одном опыте равна $0{,}5$. Каково наиболее вероятное число успехов? - а) $0$ - б) $1$ - в) $2$"},{"id":"tvims3-034","no":9,"source":"Учебник · Практика · §3 · Тестовые задачи","group":"Тестовые задачи","raw":"Игральную кость подбросили три раза. Найти вероятность того, что «6» появится ровно два раза.","html":"\u003cp\u003eИгральную кость подбросили три раза. Найти вероятность того, что «6» появится ровно два раза.\u003c/p\u003e\n","text":"Игральную кость подбросили три раза. Найти вероятность того, что «6» появится ровно два раза."},{"id":"tvims3-035","no":10,"source":"Учебник · Практика · §3 · Тестовые задачи","group":"Тестовые задачи","raw":"Код замка состоит из одной цифры. Найти вероятность того, что его удастся подобрать, имея две попытки.","html":"\u003cp\u003eКод замка состоит из одной цифры. Найти вероятность того, что его удастся подобрать, имея две попытки.\u003c/p\u003e\n","text":"Код замка состоит из одной цифры. Найти вероятность того, что его удастся подобрать, имея две попытки."},{"id":"tvims3-036","no":1,"source":"Учебник · Практика · §3 · Задачи для самообучения","group":"Задачи для самообучения","raw":"Партия деталей из 20 штук, содержащая 4 бракованные детали, проходит технический контроль. Проверяется качество пяти деталей, случайным образом выбранных из этой партии. Если среди них найдётся хотя бы две бракованных, то партия бракуется. Найти вероятность того, что партия будет забракована.","html":"\u003cp\u003eПартия деталей из 20 штук, содержащая 4 бракованные детали, проходит технический контроль. Проверяется качество пяти деталей, случайным образом выбранных из этой партии. Если среди них найдётся хотя бы две бракованных, то партия бракуется. Найти вероятность того, что партия будет забракована.\u003c/p\u003e\n","text":"Партия деталей из 20 штук, содержащая 4 бракованные детали, проходит технический контроль. Проверяется качество пяти деталей, случайным образом выбранных из этой партии. Если среди них найдётся хотя бы две бракованных, то партия бракуется. Найти вероятность того, что партия будет забракована."},{"id":"tvims3-037","no":2,"source":"Учебник · Практика · §3 · Задачи для самообучения","group":"Задачи для самообучения","raw":"Группе из 20 студентов к зачёту предложено 20 задач. Студент $X$ умеет решать ровно одну из этих задач. Студенты по одному подходят к столу преподавателя и случайным образом выбирают карточку с задачей. Зачёт считается сданным, если студент решает выбранную задачу. Выбранные карточки обратно не возвращаются. Сравнить вероятности событий:\n\n$A(1)=\\{\\text{студент сдаст зачёт, подходя к столу преподавателя первым}\\}$ и\n$A(3)=\\{\\text{студент сдаст зачёт, подходя к столу преподавателя третьим}\\}$.\n\n- $P(A(1))\u003cP(A(3))$\n- $P(A(1))=P(A(3))$\n- $P(A(1))\u003eP(A(3))$","html":"\u003cp\u003eГруппе из 20 студентов к зачёту предложено 20 задач. Студент \u003cspan class=\"math\"\u003e\\(X\\)\u003c/span\u003e умеет решать ровно одну из этих задач. Студенты по одному подходят к столу преподавателя и случайным образом выбирают карточку с задачей. Зачёт считается сданным, если студент решает выбранную задачу. Выбранные карточки обратно не возвращаются. Сравнить вероятности событий:\u003c/p\u003e\n\u003cp\u003e\u003cspan class=\"math\"\u003e\\(A(1)=\\{\\text{студент сдаст зачёт, подходя к столу преподавателя первым}\\}\\)\u003c/span\u003e и\n\u003cspan class=\"math\"\u003e\\(A(3)=\\{\\text{студент сдаст зачёт, подходя к столу преподавателя третьим}\\}\\)\u003c/span\u003e.\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003cspan class=\"math\"\u003e\\(P(A(1))\u0026lt;P(A(3))\\)\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"math\"\u003e\\(P(A(1))=P(A(3))\\)\u003c/span\u003e\u003c/li\u003e\n\u003cli\u003e\u003cspan class=\"math\"\u003e\\(P(A(1))\u0026gt;P(A(3))\\)\u003c/span\u003e\u003c/li\u003e\n\u003c/ul\u003e\n","text":"Группе из 20 студентов к зачёту предложено 20 задач. Студент $X$ умеет решать ровно одну из этих задач. Студенты по одному подходят к столу преподавателя и случайным образом выбирают карточку с задачей. Зачёт считается сданным, если студент решает выбранную задачу. Выбранные карточки обратно не возвращаются. Сравнить вероятности событий: $A(1)=\\{\\text{студент сдаст зачёт, подходя к столу преподавателя первым}\\}$ и $A(3)=\\{\\text{студент сдаст зачёт, подходя к столу преподавателя третьим}\\}$. - $P(A(1))\u003cP(A(3))$ - $P(A(1))=P(A(3))$ - $P(A(1))\u003eP(A(3))$"},{"id":"tvims3-038","no":3,"source":"Учебник · Практика · §3 · Задачи для самообучения","group":"Задачи для самообучения","raw":"На факультете в среднем десять процентов студентов являются отличниками. Найти вероятность того, что в группе из трёх, случайным образом выбранных студентов, отличников будет меньше, чем не отличников.","html":"\u003cp\u003eНа факультете в среднем десять процентов студентов являются отличниками. Найти вероятность того, что в группе из трёх, случайным образом выбранных студентов, отличников будет меньше, чем не отличников.\u003c/p\u003e\n","text":"На факультете в среднем десять процентов студентов являются отличниками. Найти вероятность того, что в группе из трёх, случайным образом выбранных студентов, отличников будет меньше, чем не отличников."},{"id":"tvims3-039","no":4,"source":"Учебник · Практика · §3 · Задачи для самообучения","group":"Задачи для самообучения","raw":"При переливании крови необходимо учитывать группы крови больного и донора. Человеку, имеющему четвёртую группу крови, можно перелить кровь любой группы; человеку со второй и третьей группой крови можно перелить кровь той же группы или первой; человеку с первой группой можно перелить кровь только первой группы. Среди населения 33,7% имеют первую, 37,5% — вторую, 20,9% — третью и 7,9% — четвёртую группу крови. Найти вероятность того, что случайно выбранному больному можно перелить кровь случайно выбранного донора.","html":"\u003cp\u003eПри переливании крови необходимо учитывать группы крови больного и донора. Человеку, имеющему четвёртую группу крови, можно перелить кровь любой группы; человеку со второй и третьей группой крови можно перелить кровь той же группы или первой; человеку с первой группой можно перелить кровь только первой группы. Среди населения 33,7% имеют первую, 37,5% — вторую, 20,9% — третью и 7,9% — четвёртую группу крови. Найти вероятность того, что случайно выбранному больному можно перелить кровь случайно выбранного донора.\u003c/p\u003e\n","text":"При переливании крови необходимо учитывать группы крови больного и донора. Человеку, имеющему четвёртую группу крови, можно перелить кровь любой группы; человеку со второй и третьей группой крови можно перелить кровь той же группы или первой; человеку с первой группой можно перелить кровь только первой группы. Среди населения 33,7% имеют первую, 37,5% — вторую, 20,9% — третью и 7,9% — четвёртую группу крови. Найти вероятность того, что случайно выбранному больному можно перелить кровь случайно выбранного донора."},{"id":"tvims3-040","no":5,"source":"Учебник · Практика · §3 · Задачи для самообучения","group":"Задачи для самообучения","raw":"Двое рабочих посменно работают на станке, изготавливая однотипные детали. Производительность первого вдвое выше производительности второго. Процент брака в продукции первого рабочего составляет 5%, а в продукции второго рабочего — 10%. Наугад выбранное из произведённой ими продукции изделие оказалось бракованным. Найти вероятность того, что оно изготовлено первым рабочим.","html":"\u003cp\u003eДвое рабочих посменно работают на станке, изготавливая однотипные детали. Производительность первого вдвое выше производительности второго. Процент брака в продукции первого рабочего составляет 5%, а в продукции второго рабочего — 10%. Наугад выбранное из произведённой ими продукции изделие оказалось бракованным. Найти вероятность того, что оно изготовлено первым рабочим.\u003c/p\u003e\n","text":"Двое рабочих посменно работают на станке, изготавливая однотипные детали. Производительность первого вдвое выше производительности второго. Процент брака в продукции первого рабочего составляет 5%, а в продукции второго рабочего — 10%. Наугад выбранное из произведённой ими продукции изделие оказалось бракованным. Найти вероятность того, что оно изготовлено первым рабочим."},{"id":"tvims3-041","no":6,"source":"Учебник · Практика · §3 · Задачи для самообучения","group":"Задачи для самообучения","raw":"Вероятность выигрыша на один лотерейный билет равна $0{,}1$. Определить, сколько билетов нужно купить, чтобы вероятность выигрыша хотя бы по одному из билетов была не менее $0{,}9$.","html":"\u /p\u003e\n","text":"На столе находятся 2 урны. В первой 2 белых и 3 чёрных шара, во второй — 4 белых и 2 чёрных. Из каждой урны вынимают по 1 шару. Найти вероятность того, что они будут одинакового цвета."},{"id":"tvims3-044","no":9,"source":"Учебник · Практика · §3 · Задачи для самообучения","group":"Задачи для самообучения","raw":"В корзине находятся 3 новых и 2 игранных теннисных мяча. Для игровой теннисной партии из корзины извлекли 2 мяча и после окончания партии вернули их обратно. Затем для второй партии снова извлекли 2 мяча, которые оказались игранными. Найти вероятность того, что оба мяча, выбранных для первой партии, тоже были игранными.","html":"\u003cp\u003eВ корзине находятся 3 новых и 2 игранных теннисных мяча. Для игровой теннисной партии из корзины извлекли 2 мяча и после окончания партии вернули их обратно. Затем для второй партии снова извлекли 2 мяча, которые оказались игранными. Найти вероятность того, что оба мяча, выбранных для первой партии, тоже были игранными.\u003c/p\u003e\n","text":"В корзине находятся 3 новых и 2 игранных теннисных мяча. Для игровой теннисной партии из корзины извлекли 2 мяча и после окончания партии вернули их обратно. Затем для второй партии снова извлекли 2 мяча, которые оказались игранными. Найти вероятность того, что оба мяча, выбранных для первой партии, тоже были игранными."},{"id":"tvims3-045","no":1,"source":"Учебник · Практика · §3 · Контрольные задачи","group":"Контрольные задачи","raw":"Каждую секунду по дороге с однополосным односторонним движением, в месте, которое выбрал для перехода пешеход, с вероятностью $0{,}5$ проезжает автомобиль. Для перехода дороги пешеходу требуется 4 секунды. Найти вероятность того, что за время его перехода дороги траекторию его движения не пересечёт ни одна машина.","html":"\u003cp\u003eКаждую секунду по дороге с однополосным односторонним движением, в месте, которое выбрал для перехода пешеход, с вероятностью \u003cspan class=\"math\"\u003e\\(0{,}5\\)\u003c/span\u003e проезжае ва студента МЭИ окажутся в разных вагонах.","html":"\u003cp\u003eТри студента МАИ, два студента МЭИ и четыре студента МГУ наугад рассаживаются в три вагона. Для каждого пассажира вероятность оказаться в любом из вагонов одинакова. Найти вероятности следующих событий: а) три студента МАИ окажутся в разных вагонах; б) два студента МЭИ окажутся в разных вагонах.\u003c/p\u003e\n","text":"Три студента МАИ, два студента МЭИ и четыре студента МГУ наугад рассаживаются в три вагона. Для каждого пассажира вероятность оказаться в любом из вагонов одинакова. Найти вероятности следующих событий: а) три студента МАИ окажутся в разных вагонах; б) два студента МЭИ окажутся в разных вагонах."},{"id":"tvims3-056","no":6,"source":"Учебник · Теория · 2.3. Типовые задачи","group":"2.3. Типовые задачи","raw":"Предположим, что в каждом из трёх вагонов есть ровно $k$ мест, и каждый из трёх студентов МАИ может занять любое из имеющихся мест. Найти вероятность того, что три студента МАИ окажутся в разных вагонах.","html":"\u003cp\u003eПредположим, что в каждом из трёх вагонов есть ровно \u003cspan class=\"math\"\u003e\\(k\\)\u003c/span\u003e мест, и каждый из трёх студентов МАИ может занять любое из имеющихся мест. Найти вероятность того, что три студента МАИ окажутся в разных вагонах.\u003c/p\u003e\n","text":"Предположим, что в каждом из трёх вагонов есть ровно $k$ мест, и каждый из трёх студентов МАИ может занять любое из имеющихся мест. Найти вероятность того, что три студента МАИ окажутся в разных вагонах."},{"id":"tvims3-057","no":7,"source":"Учебник · Теория · 2.3. Типовые задачи","group":"2.3. Типовые задачи","raw":"В розыгрыше лотереи участвуют 100 билетов, среди которых 25 выигрышных. Какова вероятность остаться без выигрыша, приобретя 3 билета лотереи?","html":"\u003cp\u003eВ розыгрыше лотереи участвуют 100 билетов, среди которых 25 выигрышных. Какова вероятность остаться без выигрыша, приобретя 3 билета лотереи?\u003c/p\u003e\n","text":"В розыгрыше лотереи участвуют 100 билетов, среди которых 25 выигрышных. Какова вероятность остаться без выигрыша, приобретя 3 билета лотереи?"},{"id":"tvims3-058","no":8,"source":"Учебник · Теория · 2.3. Типовые задачи","group":"2.3. Типовые задачи","raw":"Усложним, по сравнению с предыдущей задачей, правила лотереи. Пусть в лотерее осуществляется розыгрыш 6 номеров из 49. Порядок выпадения выигрышных номеров неважен. Участник лотереи выбирает 6 номеров из 49. Выигрыш выплачивается угадавшим 4, 5 или все 6 номеров. Определить вероятность угадывания ровно четырех выигрышных номеров.","html":"\u003cp\u003eУсложним, по сравнению с предыдущей задачей, правила лотереи. Пусть в лотерее осуществляется розыгрыш 6 номеров из 49. Порядок выпадения выигрышных номеров неважен. Участник лотереи выбирает 6 номеров из 49. Выигрыш выплачивается угадавшим 4, 5 или все 6 номеров. Определить вероятность угадывания ровно четырех выигрышных номеров.\u003c/p\u003e\n","text":"Усложним, по сравнению с предыдущей задачей, правила лотереи. Пусть в лотерее осуществляется розыгрыш 6 номеров из 49. Порядок выпадения выигрышных номеров неважен. Участник лотереи выбирает 6 номеров из 49. Выигрыш выплачивается угадавшим 4, 5 или все 6 номеров. Определить вероятность угадывания ровно четырех выигрышных номеров."},{"id":"tvims3-059","no":9,"source":"Учебник · Теория · 2.3. Типовые задачи","group":"2.3. Типовые задачи","raw":"Пусть $P(A)=P(B)=\\frac12$. Верно ли, что $P(A\\mid B)=P(B\\mid A)$?","html":"\u003cp\u003eПусть \u003cspan class=\"math\"\u003e\\(P(A)=P(B)=\\frac12\\)\u003c/span\u003e. Верно ли, что \u003cspan class=\"math\"\u003e\\(P(A\\mid B)=P(B\\mid A)\\)\u003c/span\u003e?\u003c/p\u003e\n","text":"Пусть $P(A)=P(B)=\\frac12$. Верно ли, что $P(A\\mid B)=P(B\\mid A)$?"},{"id":"tvims3-060","no":10,"source":"Учебник · Теория · 2.3. Типовые задачи","group":"2.3. Типовые задачи","raw":"Пусть $H_1,H_2,H_3,H_4$ — равновероятные гипотезы. Являются ли гипотезами события $H_1+H_2$ и $H_3+H_4$?","html":"\u003cp\u003eПусть \u003cspan class=\"math\"\u003e\\(H_1,H_2,H_3,H_4\\)\u003c/span\u003e — равновероятные гипотезы. Являются ли гипотезами события \u003cspan class=\"math\"\u003e\\(H_1+H_2\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(H_3+H_4\\)\u003c/span\u003e?\u003c/p\u003e\n","text":"Пусть $H_1,H_2,H_3,H_4$ — равновероятные гипотезы. Являются ли гипотезами события $H_1+H_2$ и $H_3+H_4$?"},{"id":"tvims3-061","no":11,"source":"Учебник · Теория · 2.3. Типовые задачи","group":"2.3. Типовые задачи","raw":"Пусть $P(B)\u003e0$. Доказать, что $P(\\overline A\\mid B)=1-P(A\\mid B)$.","html":"\u003cp\u003eПусть \u003cspan class=\"math\"\u003e\\(P(B)\u0026gt;0\\)\u003c/span\u003e. Доказать, что \u003cspan class=\"math\"\u003e\\(P(\\overline A\\mid B)=1-P(A\\mid B)\\)\u003c/span\u003e.\u003c/p\u003e\n","text":"Пусть $P(B)\u003e0$. Доказать, что $P(\\overline A\\mid B)=1-P(A\\mid B)$."},{"id":"tvims3-062","no":1,"source":"Учебник · Теория · 3.5. Формула Бернулли","group":"3.5. Формула Бернулли","raw":"Монету подбрасывают 5 раз. Найти вероятность того, что «герб» выпадет ровно 3 раза. *(Пример 3.4 из исходного материала.)*","html":"\u003cp\u003eМонету подбрасывают 5 раз. Найти вероятность того, что «герб» выпадет ровно 3 раза. \u003cem\u003e(Пример 3.4 из исходного материала.)\u003c/em\u003e\u003c/p\u003e\n","text":"Монету подбрасывают 5 раз. Найти вероятность того, что «герб» выпадет ровно 3 раза. *(Пример 3.4 из исходного материала.)*"},{"id":"tvims3-063","no":1,"source":"Учебник · Теория · 3.6. Типовые задачи","group":"3.6. Типовые задачи","raw":"Из колоды (52 карты) наугад вынимается одна. Являются ли зависимыми события $A=\\{\\text{эта карта — туз}\\}$ и $B=\\{\\text{эта карта имеет пиковую масть}\\}$?","html":"\u003cp\u003eИз колоды (52 карты) наугад вынимается одна. Являются ли зависимыми события \u003cspan class=\"math\"\u003e\\(A=\\{\\text{эта карта — туз}\\}\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(B=\\{\\text{эта карта имеет пиковую масть}\\}\\)\u003c/span\u003e?\u003c/p\u003e\n","text":"Из колоды (52 карты) наугад вынимается одна. Являются ли зависимыми события $A=\\{\\text{эта карта — туз}\\}$ и $B=\\{\\text{эта карта имеет пиковую масть}\\}$?"},{"id":"tvims3-064","no":2,"source":"Учебник · Теория · 3.6. Типовые задачи","group":"3.6. Типовые задачи","raw":"Пусть $P(C)=\\frac12$. Сравнить вероятности $P(A+B\\mid C)$ и $P(A\\mid C)+P(B\\mid C)$.","html":"\u003cp\u003eПусть \u003cspan class=\"math\"\u003e\\(P(C)=\\frac12\\)\u003c/span\u003e. Сравнить вероятности \u003cspan class=\"math\"\u003e\\(P(A+B\\mid C)\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(P(A\\mid C)+P(B\\mid C)\\)\u003c/span\u003e.\u003c/p\u003e\n","text":"Пусть $P(C)=\\frac12$. Сравнить вероятности $P(A+B\\mid C)$ и $P(A\\mid C)+P(B\\mid C)$."},{"id":"tvims3-065","no":3,"source":"Учебник · Теория · 3.6. Типовые задачи","group":"3.6. Типовые задачи","raw":"Пусть $P(A)=\\frac17$, $P(B)=\\frac4{21}$. Верно ли, что $P(A+B)\\le\\frac13$? Ответ обосновать.","html":"\u003cp\u003eПусть \u003cspan class=\"math\"\u003e\\(P(A)=\\frac17\\)\u003c/span\u003e, \u003cspan class=\"math\"\u003e\\(P(B)=\\frac4{21}\\)\u003c/span\u003e. Верно ли, что \u003cspan class=\"math\"\u003e\\(P(A+B)\\le\\frac13\\)\u003c/span\u003e? Ответ обосновать.\u003c/p\u003e\n","text":"Пусть $P(A)=\\frac17$, $P(B)=\\frac4{21}$. Верно ли, что $P(A+B)\\le\\frac13$? Ответ обосновать."},{"id":"tvims3-066","no":4,"source":"Учебник · Теория · 3.6. Типовые задачи","group":"3.6. Типовые задачи","raw":"Пусть $H_1,H_2,H_3$ — равновероятные гипотезы. Произошло событие $A=H_2+H_3$. Образуют ли систему гипотез события $H_1+H_2$ и $H_3$? Если да, то найдите их апостериорные вероятности.","html":"\u003cp\u003eПусть \u003cspan class=\"math\"\u003e\\(H_1,H_2,H_3\\)\u003c/span\u003e — равновероятные гипотезы. Произошло событие \u003cspan class=\"math\"\u003e\\(A=H_2+H_3\\)\u003c/span\u003e. Образуют ли систему гипотез события \u003cspan class=\"math\"\u003e\\(H_1+H_2\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(H_3\\)\u003c/span\u003e? Если да, то найдите их апостериорные вероятности.\u003c/p\u003e\n","text":"Пусть $H_1,H_2,H_3$ — равновероятные гипотезы. Произошло событие $A=H_2+H_3$. Образуют ли систему гипотез события $H_1+H_2$ и $H_3$? Если да, то найдите их апостериорные вероятности."},{"id":"tvims3-067","no":5,"source":"Учебник · Теория · 3.6. Типовые задачи","group":"3.6. Типовые задачи","raw":"Система состоит из двух элементов с надёжностями $p_1$ и $p_2$ соответственно. Элементы соединены параллельно и выходят из строя независимо друг от друга. Работоспособность системы сохраняется, если работает хотя бы один элемент. Система работает. Найти вероятность того, что неисправен первый элемент.","html":"\u003cp\u003eСистема состоит из двух элементов с надёжностями \u003cspan class=\"math\"\u003e\\(p_1\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(p_2\\)\u003c/span\u003e соответственно. Элементы соединены параллельно и выходят из строя независимо друг от друга. Работоспособность системы сохраняется, если работает хотя бы один элемент. Система работает. Найти вероятность того, что неисправен первый элемент.\u003c/p\u003e\n","text":"Система состоит из двух элементов с надёжностями $p_1$ и $p_2$ соответственно. Элементы соединены параллельно и выходят из строя независимо друг от друга. Работоспособность системы сохраняется, если работает хотя бы один элемент. Система работает. Найти вероятность того, что неисправен первый элемент."},{"id":"tvims3-068","no":6,"source":"Учебник · Теория · 3.6. Типовые задачи","group":"3.6. Типовые задачи","raw":"Некто нашёл чужую пластиковую карточку банкомата. Найти вероятность того, что двух попыток, предоставляемых банкоматом, хватит для того, чтобы отгадать неизвестный ему четырёхзначный код.","html":"\u003cp\u003eНекто нашёл чужую пластиковую карточку банкомата. Найти вероятность того, что двух попыток, предоставляемых банкоматом, хватит для того, чтобы отгадать неизвестный ему четырёхзначный код.\u003c/p\u003e\n","text":"Некто стное. Найти вероятность того, что: а) поиск $k$-го пряника начнётся с пустого кармана, если у Пончика 17 карманов, в которых изначально лежало по одному прянику; б) Пончик первые два раза будет подкрепляться пряниками, если в двух из имеющихся у него 17 карманов лежит по одному прянику, а в 15 — по одной конфете; в) Пончик первые два раза будет подкрепляться пряниками, если у него 10 карманов, в одном из которых — два пряника, а в остальных — по две конфеты.","html":"\u003cp\u003eПончик отправился в путешествие на воздушном шаре. Через каждые 10 минут полёта у Пончика возникает желание подкрепиться, и он начинает в случайном порядке просматривать свои карманы до тех пор, пока не найдёт съестное. Найти вероятность того, что: а) поиск \u003cspan class=\"math\"\u003e\\(k\\)\u003c/span\u003e-го пряника начнётся с пустого кармана, если у Пончика 17 карманов, в которых изначально лежало по одному прянику; б) Пончик первые два раза будет подкрепляться пряниками, если в двух из имеющихся у него 17 карманов лежит по одному прянику, а в 15 — по одной конфете; в) Пончик первые два раза будет подкрепляться пряниками, если у него 10 карманов, в одном из которых — два пряника, а в остальных — по две конфеты.\u003c/p\u003e\n","text":"Пончик отправился в путешествие на воздушном шаре. Через каждые 10 минут полёта у Пончика возникает желание подкрепиться, и он начинает в случайном порядке просматривать свои карманы до тех пор, пока не найдёт съестное. Найти вероятность того, что: а) поиск $k$-го пряника начнётся с пустого кармана, если у Пончика 17 карманов, в которых изначально лежало по одному прянику; б) Пончик первые два раза будет подкрепляться пряниками, если в двух из имеющихся у него 17 карманов лежит по одному прянику, а в 15 — по одной конфете; в) Пончик первые два раза будет подкрепляться пряниками, если у него 10 карманов, в одном из которых — два пряника, а в остальных — по две конфеты."},{"id":"tvims3-073","no":2,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Владелец пластиковой карточки банкомата забыл последние три цифры кода и набрал их наугад. Какова вероятность набора верного номера, если известно, что все эти три цифры различны?","html":"\u003cp\u003eВладелец пластиковой карточки банкомата забыл последние три цифры кода и набрал их наугад. Какова вероятность набора верного номера, если известно, что все эти три цифры различны?\u003c/p\u003e\n","text":"Владелец пластиковой карточки банкомата забыл последние три цифры кода и набрал их наугад. Какова вероятность набора верного номера, если известно, что все эти три цифры различны?"},{"id":"tvims3-074","no":3,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Из десяти вариантов контрольной работы, написанных на отдельных карточках, наугад выбирают восемь и раздают восьми студентам, сидящим в одном ряду. Найти вероятность следующих событий: $A=\\{\\text{варианты 1 и 2 останутся неиспользованными}\\}$; $B=\\{\\text{варианты 1 и 2 останутся неиспользованными}\\}$; $C=\\{\\text{будут распределены последовательные номера вариантов}\\}$.","html":"\u003cp\u003eИз десяти вариантов контрольной работы, написанных на отдельных карточках, наугад выбирают восемь и раздают восьми студентам, сидящим в одном ряду. Найти вероятность следующих событий: \u003cspan class=\"math\"\u003e\\(A=\\{\\text{варианты 1 и 2 останутся неиспользованными}\\}\\)\u003c/span\u003e; \u003cspan class=\"math\"\u003e\\(B=\\{\\text{варианты 1 и 2 останутся неиспользованными}\\}\\)\u003c/span\u003e; \u003cspan class=\"math\"\u003e\\(C=\\{\\text{будут распределены последовательные номера вариантов}\\}\\)\u003c/span\u003e.\u003c/p\u003e\n","text":"Из десяти вариантов контрольной работы, написанных на отдельных карточках, наугад выбирают восемь и раздают восьми студентам, сидящим в одном ряду. Найти вероятность следующих событий: $A=\\{\\text{варианты 1 и 2 останутся неиспользованными}\\}$; $B=\\{\\text{варианты 1 и 2 останутся неиспользованными}\\}$; $C=\\{\\text{будут распределены последовательные номера вариантов}\\}$."},{"id":"tvims3-075","no":4,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Полная колода карт (52 листа) делится наугад на две равные части по 26 карт. Найти вероятность следующих событий: $A=\\{\\text{в каждой пачке по два туза}\\}$; $B=\\{\\text{все тузы в одной пачке}\\}$; $C=\\{\\text{в одной пачке будет один туз, а в другой — три}\\}$.","html":"\u003cp\u003eПолная колода карт (52 листа) делится наугад на две равные части по 26 карт. Найти вероятность следующих событий: \u003cspan class=\"math\"\u003e\\(A=\\{\\text{в каждой пачке по два туза}\\}\\)\u003c/span\u003e; \u003cspan class=\"math\"\u003e\\(B=\\{\\text{все тузы в одной пачке}\\}\\)\u003c/span\u003e; \u003cspan class=\"math\"\u003e\\(C=\\{\\text{в одной пачке будет один туз, а в другой — три}\\}\\)\u003c/span\u003e.\u003c/p\u003e\n","text":"Полная колода карт (52 листа) делится наугад на две равные части по 26 карт. Найти вероятность следующих событий: $A=\\{\\text{в каждой пачке по два туза}\\}$; $B=\\{\\text{все тузы в одной пачке}\\}$; $C=\\{\\text{в одной пачке будет один туз, а в другой — три}\\}$."},{"id":"tvims3-076","no":5,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"В предположении, что день рождения любого человека равновероятен в любой день года, найти вероятность того, что все люди в компании из $r$ человек родились в различные дни. Подсчитать эту вероятность для $r=23$.","html":"\u003cp\u003eВ предположении, что день рождения любого человека равновероятен в любой день года, найти вероятность того, что все люди в компании из \u003cspan class=\"math\"\u003e\\(r\\)\u003c/span\u003e человек родились в различные дни. Подсчитать эту вероятность для \u003cspan class=\"math\"\u003e\\(r=23\\)\u003c/span\u003e.\u003c/p\u003e\n","text":"В предположении, что день рождения любого человека равновероятен в любой день года, найти вероятность того, что все люди в компании из $r$ человек родились в различные дни. Подсчитать эту вероятность для $r=23$."},{"id":"tvims3-077","no":6,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Из шести букв разрезной азбуки составлено слово АНАНАС. Ребенок, не умеющий читать, рассыпал эти буквы и затем собрал в произвольном порядке. Найти вероятность того, что у него снова получится слово АНАНАС.","html":"\u003cp\u003eИз шести букв разрезной азбуки составлено слово АНАНАС. Ребенок, не умеющий читать, рассыпал эти буквы и затем собрал в произвольном порядке. Найти вероятность того, что у него снова получится слово АНАНАС.\u003c/p\u003e\n","text":"Из шести букв разрезной азбуки составлено слово АНАНАС. Ребенок, не умеющий читать, рассыпал эти буквы и затем собрал в произвольном порядке. Найти вероятность того, что у него снова получится слово АНАНАС."},{"id":"tvims3-078","no":7,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Компания занимается организацией отдыха для любителей рыбной ловли. На озере, где находится туристическая база компании, оборудовано для рыбной ловли 30 мест. Набрана группа из 5 отдыхающих, которым, независимо друг от друга, предоставлено право выбора места рыбной ловли. В предположении, что все места одинаково привлекательны для любого отдыхающего, вычислить вероятность того, что все отдыхающие выберут различные места.","html":"\u003cp\u003eКомпания занимается организацией отдыха для любителей рыбной ловли. На озере, где находится туристическая база компании, оборудовано для рыбной ловли 30 мест. Набрана группа из 5 отдыхающих, которым, независимо друг от друга, предоставлено право выбора места рыбной ловли. В предположении, что все места одинаково привлекательны для любого отдыхающего, вычислить вероятность того, что все отдыхающие выберут различные места.\u003c/p\u003e\n","text":"Компания занимается организацией отдыха для любителей рыбной ловли. На озере, где находится туристическая база компании, оборудовано для рыбной ловли 30 мест. Набрана группа из 5 отдыхающих, которым, независимо друг от друга, предоставлено право выбора места рыбной ловли. В предположении, что все места одинаково привлекательны для любого отдыхающего, вычислить вероятность того, что все отдыхающие выберут различные места."},{"id":"tvims3-079","no":8,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Из цифр 1, 2, 3 наугад составляется шестизначное число. Найти вероятность того, что в этом числе цифра 1 будет встречаться один раз, цифра 2 – два раза, цифра 3 – три раза.","html":"\u003cp\u003eИз цифр 1, 2, 3 наугад составляется шестизначное число. Найти вероятность того, что в этом числе цифра 1 будет встречаться один раз, цифра 2 – два раза, цифра 3 – три раза.\u003c/p\u003e\n","text":"Из цифр 1, 2, 3 наугад составляется шестизначное число. Найти вероятность того, что в этом числе цифра 1 будет встречаться один раз, цифра 2 – два раза, цифра 3 – три раза."},{"id":"tvims3-080","no":9,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Из цифр 1, 2, 3 наугад составляется шестизначное число. Найти вероятность того, что получится четное число, содержащее всего одну цифру 2.","html":"\u003cp\u003eИз цифр 1, 2, 3 наугад составляется шестизначное число. Найти вероятность того, что получится четное число, содержащее всего одну цифру 2.\u003c/p\u003e\n","text":"Из цифр 1, 2, 3 наугад составляется шестизначное число. Найти вероятность того, что получится четное число, содержащее всего одну цифру 2."},{"id":"tvims3-081","no":10,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Рассмотрим карточную игру, когда колода из 32 карт (без шестерок) раздается трем игрокам, получающим по 10 карт, а 2 карты откладываются в сторону. Какова вероятность того, что отложенные в сторону карты окажутся тузами?","html":"\u003cp\u003eРассмотрим карточную игру, когда колода из 32 карт (без шестерок) раздается трем игрокам, получающим по 10 карт, а 2 карты откладываются в сторону. Какова вероятность того, что отложенные в сторону карты окажутся тузами?\u003c/p\u003e\n","text":"Рассмотрим карточную игру, когда колода из 32 карт (без шестерок) раздается трем игрокам, получающим по 10 карт, а 2 карты откладываются в сторону. Какова вероятность того, что отложенные в сторону карты окажутся тузами?"},{"id":"tvims3-082","no":11,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"В гостинице имеется шесть одноместных номеров. На эти номера имеется 10 претендентов: 6 мужчин и 4 женщины. Гостиница следует правилу FIFO: пришедшие раньше облуживаются раньше. Все претенденты пребывают в гостиницу в случайном порядке. Какова вероятность того, что номера получат: а) все шесть претендентов мужского пола; б) четверо мужчин и две женщины; в) по крайней мере одна из четырех женщин?","html":"\u003cp\u003eВ гостинице имеется шесть одноместных номеров. На эти номера имеется 10 претендентов: 6 мужчин и 4 женщины. Гостиница следует правилу FIFO: пришедшие раньше облуживаются раньше. Все претенденты пребывают в гостиницу в случайном порядке. Какова вероятность того, что номера получат: а) все шесть претендентов мужского пола; б) четверо мужчин и две женщины; в) по крайней мере одна из четырех женщин?\u003c/p\u003e\n","text":"В гостинице имеется шесть одноместных номеров. На эти номера имеется 10 претендентов: 6 мужчин и 4 женщины. Гостиница следует правилу FIFO: пришедшие раньше облуживаются раньше. Все претенденты пребывают в гостиницу в случайном порядке. Какова вероятность того, что номера получат: а) все шесть претендентов мужского пола; б) четверо мужчин и две женщины; в) по крайней мере одна из четырех женщин?"},{"id":"tvims3-083","no":12,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Парадокс де Мере. Подбрасывают три игральные кости и подсчитывают сумму выпавших очков. Де Мере заметил, что появление одиннадцати очков возможно при шести комбинациях (6-4-1, 6-3-2, 5-5-1, 5-4-2, 5-3-3, 4-4-3) и появление двенадцати очков возможно при шести комбинациях (6-5-1, 6-4-2, 6-3-3, 5-5-2, 5-4-3, 4-4-4). Объяснить парадоксальность ситуации, которая состоит в том, что вероятности появления в сумме 11 и 12 очков не равны. (задача со звёздочкой в источнике)","html":"\u003cp\u003eПарадокс де Мере. Подбрасывают три игральные кости и подсчитывают сумму выпавших очков. Де Мере заметил, что появление одиннадцати очков возможно при шести комбинациях (6-4-1, 6-3-2, 5-5-1, 5-4-2, 5-3-3, 4-4-3) и появление двенадцати очков возможно при шести комбинациях (6-5-1, 6-4-2, 6-3-3, 5-5-2, 5-4-3, 4-4-4). Объяснить парадоксальность ситуации, которая состоит в том, что вероятности появления в сумме 11 и 12 очков не равны. (задача со звёздочкой в источнике)\u003c/p\u003e\n","text":"Парадокс де Мере. Подбрасывают три игральные кости и подсчитывают сумму выпавших очков. Де Мере заметил, что появление одиннадцати очков возможно при шести комбинациях (6-4-1, 6-3-2, 5-5-1, 5-4-2, 5-3-3, 4-4-3) и появление двенадцати очков возможно при шести комбинациях (6-5-1, 6-4-2, 6-3-3, 5-5-2, 5-4-3, 4-4-4). Объяснить парадоксальность ситуации, которая состоит в том, что вероятности появления в сумме 11 и 12 очков не равны. (задача со звёздочкой в источнике)"},{"id":"tvims3-084","no":13,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Восемнадцать команд, участвующих в турнире, по жребию разбиваются на две подгруппы по девять команд в каждой. Найти вероятность того, что а) все шесть лидирующих команд окажутся в одной подгруппе; б) шесть лидирующих команд распределятся по три в разные группы.","html":"\u003cp\u003eВосемнадцать команд, участвующих в турнире, по жребию разбиваются на две подгруппы по девять команд в каждой. Найти вероятность того, что а) все шесть лидирующих команд окажутся в одной подгруппе; б) шесть лидирующих команд распределятся по три в разные группы.\u003c/p\u003e\n","text":"Восемнадцать команд, участвующих в турнире, по жребию разбиваются на две подгруппы по девять команд в каждой. Найти вероятность того, что а) все шесть лидирующих команд окажутся в одной подгруппе; б) шесть лидирующих команд распределятся по три в разные группы."},{"id":"tvims3-085","no":14,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"При проведении фуршета на стол поставили пять бокалов шампанского, три бокала белого вина и два бокала красного вина. К столу подошли семь человек и взяли по одному бокалу. Найти вероятность того, что на столе осталось по одному бокалу каждого напитка. (Будем предполагать, что для каждого из гостей все напитки одинаково привлекательны.)","html":"\u003cp\u003eПри проведении фуршета на стол поставили пять бокалов шампанского, три бокала белого вина и два бокала красного вина. К столу подошли семь человек и взяли по одному бокалу. Найти вероятность того, что на столе осталось по одному бокалу каждого напитка. (Будем предполагать, что для каждого из гостей все напитки одинаково привлекательны.)\u003c/p\u003e\n","text":"При проведении фуршета на стол поставили пять бокалов шампанского, три бокала белого вина и два бокала красного вина. К столу подошли семь человек и взяли по одному бокалу. Найти вероятность того, что на столе осталось по одному бокалу каждого напитка. (Будем предполагать, что для каждого из гостей все напитки одинаково привлекательны.)"},{"id":"tvims3-086","no":15,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Каждый из 50 штатов представлен в сенате США двумя сенаторами. Предстоит выбрать некоторый комитет из 50 сенаторов. Найти вероятности следующих событий: а) штат Айова будет представлен в комитете; б) все штаты будут представлены в комитете. (Будем предполагать, что все сенаторы имеют равные шансы быть избранными в этот комитет.)","html":"\u003cp\u003eКаждый из 50 штатов представлен в сенате США двумя сенаторами. Предстоит выбрать некоторый комитет из 50 сенаторов. Найти вероятности следующих событий: а) штат Айова будет представлен в комитете; б) все штаты будут представлены в комитете. (Будем предполагать, что все сенаторы имеют равные шансы быть избранными в этот комитет.)\u003c/p\u003e\n","text":"Каждый из 50 штатов представлен в сенате США двумя сенаторами. Предстоит выбрать некоторый комитет из 50 сенаторов. Найти вероятности следующих событий: а) штат Айова будет представлен в комитете; б) все штаты будут представлены в комитете. (Будем предполагать, что все сенаторы имеют равные шансы быть избранными в этот комитет.)"},{"id":"tvims3-087","no":16,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"В городе проживает $n+1$ человек. Один из них, узнав новость, сообщает её другому, тот — третьему и т. д., причём каждый человек передаёт новость наугад выбранному жителю города, за исключением того, от кого он её услышал. Найти вероятность того, что новость будет передана $r$ раз без возвращения к человеку, который узнал её первым. (задача со звёздочкой в источнике)","html":"\u003cp\u003eВ городе проживает \u003cspan class=\"math\"\u003e\\(n+1\\)\u003c/span\u003e человек. Один из них, узнав новость, сообщает её другому, тот — третьему и т. д., причём каждый человек передаёт новость наугад выбранному жителю города, за исключением того, от кого он её услышал. Найти вероятность того, что новость будет передана \u003cspan class=\"math\"\u003e\\(r\\)\u003c/span\u003e раз без возвращения к человеку, который узнал её первым. (задача со звёздочкой в источнике)\u003c/p\u003e\n","text":"В городе проживает $n+1$ человек. Один из них, узнав новость, сообщает её другому, тот — третьему и т. д., причём каждый человек передаёт новость наугад выбранному жителю города, за исключением того, от кого он её услышал. Найти вероятность того, что новость будет передана $r$ раз без возвращения к человеку, который узнал её первым. (задача со звёздочкой в источнике)"},{"id":"tvims3-088","no":17,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Для рекламы своей продукции производитель решил снабдить специальными купонами 10 000 изделий из произведенных 500 000 изделий. Покупатель, отославший в адрес компании 3 купона, получает 1 дополнительный экземпляр продукции, 4 купона – 2 дополнительных экземпляра, более четырех купонов – 3 дополнительных экземпляра. Покупатель одновременно приобрел пять экземпляров продукции компании и решил участвовать в предложенной рекламной акции. Найти вероятность того, что он получит дополнительно не менее двух экземпляров продукции.","html":"\u003cp\u003eДля рекламы своей продукции производитель решил снабдить специальными купонами 10 000 изделий из произведенных 500 000 изделий. Покупатель, отославший в адрес компании 3 купона, получает 1 дополнительный экземпляр продукции, 4 купона – 2 дополнительных экземпляра, более четырех купонов – 3 дополнительных экземпляра. Покупатель одновременно приобрел пять экземпляров продукции компании и решил участвовать в предложенной рекламной акции. Найти вероятность того, что он получит дополнительно не менее двух экземпляров продукции.\u003c/p\u003e\n","text":"Для рекламы своей продукции производитель решил снабдить специальными купонами 10 000 изделий из произведенных 500 000 изделий. Покупатель, отославший в адрес компании 3 купона, получает 1 дополнительный экземпляр продукции, 4 купона – 2 дополнительных экземпляра, более четырех купонов – 3 дополнительных экземпляра. Покупатель одновременно приобрел пять экземпляров продукции компании и решил участвовать в предложенной рекламной акции. Найти вероятность того, что он получит дополнительно не менее двух экземпляров продукции."},{"id":"tvims3-089","no":18,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"При формировании группы для проведения специального социологического опроса необходимо отобрать 10 человек, удовлетворяющих определенным требованиям. Вероятность того, что наугад выбранный человек удовлетворяет этим требованиям, равна 0,2. Найти вероятность того, что при отборе придется тестировать ровно 20 человек.","html":"\u003cp\u003eПри формировании группы для проведения специального социологического опроса необходимо отобрать 10 человек, удовлетворяющих определенным требованиям. Вероятность того, что наугад выбранный человек удовлетворяет этим требованиям, равна 0,2. Найти вероятность того, что при отборе придется тестировать ровно 20 человек.\u003c/p\u003e\n","text":"При формировании группы для проведения специального социологического опроса необходимо отобрать 10 человек, удовлетворяющих определенным требованиям. Вероятность того, что наугад выбранный человек удовлетворяет этим требованиям, равна 0,2. Найти вероятность того, что при отборе придется тестировать ровно 20 человек."},{"id":"tvims3-090","no":19,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Игральная кость подброшена дважды. Зависимы ли случайные события $A=\\{\\text{число очков при первом бросании равно 5}\\}$ и $B=\\{\\text{сумма очков при двух бросаниях равна 9}\\}$? Ответ обосновать.","html":"\u003cp\u003eИгральная кость подброшена дважды. Зависимы ли случайные события \u003cspan class=\"math\"\u003e\\(A=\\{\\text{число очков при первом бросании равно 5}\\}\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(B=\\{\\text{сумма очков при двух бросаниях равна 9}\\}\\)\u003c/span\u003e? Ответ обосновать.\u003c/p\u003e\n","text":"Игральная кость подброшена дважды. Зависимы ли случайные события $A=\\{\\text{число очков при первом бросании равно 5}\\}$ и $B=\\{\\text{сумма очков при двух бросаниях равна 9}\\}$? Ответ обосновать."},{"id":"tvims3-091","no":20,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Пусть $P(A)=\\frac12$, $P(B)=\\frac13$. Верно ли, что $P(AB)\\le\\frac38$? Ответ обосновать.","html":"\u003cp\u003eПусть \u003cspan class=\"math\"\u003e\\(P(A)=\\frac12\\)\u003c/span\u003e, \u003cspan class=\"math\"\u003e\\(P(B)=\\frac13\\)\u003c/span\u003e. Верно ли, что \u003cspan class=\"math\"\u003e\\(P(AB)\\le\\frac38\\)\u003c/span\u003e? Ответ обосновать.\u003c/p\u003e\n","text":"Пусть $P(A)=\\frac12$, $P(B)=\\frac13$. Верно ли, что $P(AB)\\le\\frac38$? Ответ обосновать."},{"id":"tvims3-092","no":21,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"События $A$ и $B$ независимы, $P(A)=P(B)\u003e0$. Найти $P(A+\\overline B)$.","html":"\u003cp\u003eСобытия \u003cspan class=\"math\"\u003e\\(A\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(B\\)\u003c/span\u003e независимы, \u003cspan class=\"math\"\u003e\\(P(A)=P(B)\u0026gt;0\\)\u003c/span\u003e. Найти \u003cspan class=\"math\"\u003e\\(P(A+\\overline B)\\)\u003c/span\u003e.\u003c/p\u003e\n","text":"События $A$ и $B$ независимы, $P(A)=P(B)\u003e0$. Найти $P(A+\\overline B)$."},{"id":"tvims3-093","no":22,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Вакансия, предлагаемая безработному биржей труда, удовлетворяет его с вероятностью 0,01 . Сколько нужно обслужить безработных, чтобы вероятность того, что хотя бы один из них найдет работу, была бы не ниже 0,95 ?","html":"\u003cp\u003eВакансия, предлагаемая безработному биржей труда, удовлетворяет его с вероятностью 0,01 . Сколько нужно обслужить безработных, чтобы вероятность того, что хотя бы один из них найдет работу, была бы не ниже 0,95 ?\u003c/p\u003e\n","text":"Вакансия, предлагаемая безработному биржей труда, удовлетворяет его с вероятностью 0,01 . Сколько нужно обслужить безработных, чтобы вероятность того, что хотя бы один из них найдет работу, была бы не ниже 0,95 ?"},{"id":"tvims3-094","no":23,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Из 25 вопросов, включенных в программу экзамена, студент подготовил 20. На экзамене студент наугад выбирает 5 вопросов из 25. Для сдачи экзамена достаточно ответить правильно хотя бы на 3 вопроса. Найти вероятность того, что студент сдаст экзамен.","html":"\u003cp\u003eИз 25 вопросов, включенных в программу экзамена, студент подготовил 20. На экзамене студент наугад выбирает 5 вопросов из 25. Для сдачи экзамена достаточно ответить правильно хотя бы на 3 вопроса. Найти вероятность того, что студент сдаст экзамен.\u003c/p\u003e\n","text":"Из 25 вопросов, включенных в программу экзамена, студент подготовил 20. На экзамене студент наугад выбирает 5 вопросов из 25. Для сдачи экзамена достаточно ответить правильно хотя бы на 3 вопроса. Найти вероятность того, что студент сдаст экзамен."},{"id":"tvims3-095","no":24,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Отдел надзора отделения центрального банка курирует деятельность ряда коммерческих банков. При сдаче квартальной отчетности серьезные финансовые нарушения обнаруживаются в среднем у 5% банков. На проверку выбрано три банка. Найти наиболее вероятное число банков с серьезными нарушениями финансовой отчетности среди выбранных.","html":"\u003cp\u003eОтдел надзора отделения центрального банка курирует деятельность ряда коммерческих банков. При сдаче квартальной отчетности серьезные финансовые нарушения обнаруживаются в среднем у 5% банков. На проверку выбрано три банка. Найти наиболее вероятное число банков с серьезными нарушениями финансовой отчетности среди выбранных.\u003c/p\u003e\n","text":"Отдел надзора отделения центрального банка курирует деятельность ряда коммерческих банков. При сдаче квартальной отчетности серьезные финансовые нарушения обнаруживаются в среднем у 5% банков. На проверку выбрано три банка. Найти наиболее вероятное число банков с серьезными нарушениями финансовой отчетности среди выбранных."},{"id":"tvims3-096","no":25,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Вероятность рождения мальчика равна 0,515 . На семейном совете постановили, что дети в семье будут рождаться до появления второго мальчика. Найти вероятность того, что в семье будет четверо детей.","html":"\u003cp\u003eВероятность рождения мальчика равна 0,515 . На семейном совете постановили, что дети в семье будут рождаться до появления второго мальчика. Найти вероятность того, что в семье будет четверо детей.\u003c/p\u003e\n","text":"Вероятность рождения мальчика равна 0,515 . На семейном совете постановили, что дети в семье будут рождаться до появления второго мальчика. Найти вероятность того, что в семье будет четверо детей."},{"id":"tvims3-097","no":26,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Отдел технического контроля предприятия бракует каждую партию из 100 деталей, если из 5 деталей, наугад выбранных из партии, хотя бы одна окажется бракованной. Партия содержит 5% брака. Найти вероятность для одной партии деталей быть забракованной. (Решить задачу двумя способами: используя \"\u003e\\(B\\)\u003c/span\u003e, чтобы \u003cspan class=\"math\"\u003e\\(P(A\\mid B)\u0026gt;P(A)\\)\u003c/span\u003e? Ответ обосновать.\u003c/p\u003e\n","text":"Пусть $P(A)=\\frac12$. Можно ли найти такое событие $B$, чтобы $P(A\\mid B)\u003eP(A)$? Ответ обосновать."},{"id":"tvims3-100","no":29,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Пусть $P(A)=P(B)=\\frac12$. Верно ли, что $P(A\\mid B)\\ge P(B\\mid A)$? Ответ обосновать.","html":"\u003cp\u003eПусть \u003cspan class=\"math\"\u003e\\(P(A)=P(B)=\\frac12\\)\u003c/span\u003e. Верно ли, что \u003cspan class=\"math\"\u003e\\(P(A\\mid B)\\ge P(B\\mid A)\\)\u003c/span\u003e? Ответ обосновать.\u003c/p\u003e\n","text":"Пусть $P(A)=P(B)=\\frac12$. Верно ли, что $P(A\\mid B)\\ge P(B\\mid A)$? Ответ обосновать."},{"id":"tvims3-101","no":30,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Пусть события $A$ и $B$ независимы и $P(AB)=P(B)=\\frac14$. Найти $P(A+B)$.","html":"\u003cp\u003eПусть события \u003cspan class=\"math\"\u003e\\(A\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(B\\)\u003c/span\u003e независимы и \u003cspan class=\"math\"\u003e\\(P(AB)=P(B)=\\frac14\\)\u003c/span\u003e. Найти \u003cspan class=\"math\"\u003e\\(P(A+B)\\)\u003c/span\u003e.\u003c/p\u003e\n","text":"Пусть события $A$ и $B$ независимы и $P(AB)=P(B)=\\frac14$. Найти $P(A+B)$."},{"id":"tvims3-102","no":31,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Пусть $P(A)=\\frac12$, $P(B)=\\frac23$. Верно ли, что $P(A+B)\\ge\\frac16$? Ответ обосновать.","html":"\u003cp\u003eПусть \u003cspan class=\"math\"\u003e\\(P(A)=\\frac12\\)\u003c/span\u003e, \u003cspan class=\"math\"\u003e\\(P(B)=\\frac23\\)\u003c/span\u003e. Верно ли, что \u003cspan class=\"math\"\u003e\\(P(A+B)\\ge\\frac16\\)\u003c/span\u003e? Ответ обосновать.\u003c/p\u003e\n","text":"Пусть $P(A)=\\frac12$, $P(B)=\\frac23$. Верно ли, что $P(A+B)\\ge\\frac16$? Ответ обосновать."},{"id":"tvims3-103","no":32,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Пусть $P(A)=P(B)=\\frac44$. Верно ли, что $P(A+B)$ будет больше в том случае, когда $A$ и $B$ независимы, чем когда $A$ и $B$ несовместны? Ответ обосновать.","html":"\u003cp\u003eПусть \u003cspan class=\"math\"\u003e\\(P(A)=P(B)=\\frac44\\)\u003c/span\u003e. Верно ли, что \u003cspan class=\"math\"\u003e\\(P(A+B)\\)\u003c/span\u003e будет больше в том случае, когда \u003cspan class=\"math\"\u003e\\(A\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(B\\)\u003c/span\u003e независимы, чем когда \u003cspan class=\"math\"\u003e\\(A\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(B\\)\u003c/span\u003e несовместны? Ответ обосновать.\u003c/p\u003e\n","text":"Пусть $P(A)=P(B)=\\frac44$. Верно ли, что $P(A+B)$ будет больше в том случае, когда $A$ и $B$ независимы, чем когда $A$ и $B$ несовместны? Ответ обосновать."},{"id":"tvims3-104","no":33,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Пусть $P(A)=P(B)=\\frac23$. Чему равна сумма $P(\\overline{A+B})+P(A+B)$?","html":"\u003cp\u003eПусть \u003cspan class=\"math\"\u003e\\(P(A)=P(B)=\\frac23\\)\u003c/span\u003e. Чему равна сумма \u003cspan class=\"math\"\u003e\\(P(\\overline{A+B})+P(A+B)\\)\u003c/span\u003e?\u003c/p\u003e\n","text":"Пусть $P(A)=P(B)=\\frac23$. Чему равна сумма $P(\\overline{A+B})+P(A+B)$?"},{"id":"tvims3-105","no":34,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"События $A$ и $B$ несовместны, причём $P(A)\u003e0$. Совместны или несовместны события $A$ и $B$? Ответ обосновать.","html":"\u003cp\u003eСобытия \u003cspan class=\"math\"\u003e\\(A\\)\u00 th\"\u003e\\(n\\)\u003c/span\u003e спичек? (задача со звёздочкой в источнике)\u003c/p\u003e\n","text":"Задача Банаха. Для прикуривания Банах пользовался двумя коробками спичек, доставая наугад ту или иную коробку. Через некоторое время он обнаружил, что одна коробка пуста. Найти вероятность того, что во второй коробке осталось $k$ спичек, если изначально в каждой коробке было по $n$ спичек? (задача со звёздочкой в источнике)"},{"id":"tvims3-118","no":47,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"В кармане лежат 5 монет достоинством в 50 коп., 4 монеты по 10 коп. и 1 монета – 5 коп. Наугад берут 3 монеты. Какова вероятность того, что в сумме они составляют не более одного рубля?","html":"\u003cp\u003eВ кармане лежат 5 монет достоинством в 50 коп., 4 монеты по 10 коп. и 1 монета – 5 коп. Наугад берут 3 монеты. Какова вероятность того, что в сумме они составляют не более одного рубля?\u003c/p\u003e\n","text":"В кармане лежат 5 монет достоинством в 50 коп., 4 монеты по 10 коп. и 1 монета – 5 коп. Наугад берут 3 монеты. Какова вероятность того, что в сумме они составляют не более одного рубля?"},{"id":"tvims3-119","no":48,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Фирма рассылает рекламные проспекты восьми потенциальным партнерам. В результате такой рассылки в среднем у каждого пятого потенциального партнера возникает интерес к фирме. Найти вероятность того, что это произойдет: а) в трех случаях; б) не более чем в трех.","html":"\u003cp\u003eФирма рассылает рекламные проспекты восьми потенциальным партнерам. В результате такой рассылки в среднем у каждого пятого потенциального партнера возникает интерес к фирме. Найти вероятность того, что это произойдет: а) в трех случаях; б) не более чем в трех.\u003c/p\u003e\n","text":"Фирма рассылает рекламные проспекты восьми потенциальным партнерам. В результате
