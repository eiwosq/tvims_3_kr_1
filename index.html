-122","no":51,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"В микрорайоне девять машин технической службы. Для бесперебойной работы необходимо, чтобы не меньше восьми машин были в исправном состоянии. Считая вероятность исправного состояния для всех машин одинаковой и равной 0,9 , найти вероятность бесперебойной работы технической службы в микрорайоне.","html":"\u003cp\u003eВ микрорайоне девять машин технической службы. Для бесперебойной работы необходимо, чтобы не меньше восьми машин были в исправном состоянии. Считая вероятность исправного состояния для всех машин одинаковой и равной 0,9 , найти вероятность бесперебойной работы технической службы в микрорайоне.\u003c/p\u003e\n","text":"В микрорайоне девять машин технической службы. Для бесперебойной работы необходимо, чтобы не меньше восьми машин были в исправном состоянии. Считая вероятность исправного состояния для всех машин одинаковой и равной 0,9 , найти вероятность бесперебойной работы технической службы в микрорайоне."},{"id":"tvims3-123","no":52,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"В среднем каждый десятый договор страховой компании завершается выплатой по страховому случаю. Компания заключила пять договоров. Найти вероятность того, что страховой случай наступит: а) один раз; б) хотя бы один раз.","html":"\u003cp\u003eВ среднем каждый десятый договор страховой компании завершается выплатой по страховому случаю. Компания заключила пять договоров. Найти вероятность того, что страховой случай наступит: а) один раз; б) хотя бы один раз.\u003c/p\u003e\n","text":"В среднем каждый десятый договор страховой компании завершается выплатой по страховому случаю. Компания заключила пять договоров. Найти вероятность того, что страховой случай наступит: а) один раз; б) хотя бы один раз."},{"id":"tvims3-124","no":53,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Подбросили две игральные кости. Какие из представленных ниже наборов событий образуют систему гипотез?\n\n   - 1. $H_1=\\{\\text{на первой кости выпало одно очко}\\},\\ldots,H_6=\\{\\text{на первой кости выпало шесть очков}\\}$.\n   - 2. $H_1=\\{\\text{на обеих костях выпало по одному очку}\\},\\ldots,H_6=\\{\\text{на обеих костях выпало по шесть очков}\\}$.\n   - 3. $H_1=\\{\\text{на первой кости выпало чётное число очков}\\}$, $H_2=\\{\\text{на второй кости выпало нечётное число очков}\\}$.\n   - 4. $H_1=\\{\\text{на второй кости выпало чётное число очков}\\}$, $H_2=\\{\\text{на второй кости выпало нечётное число очков}\\}$.","html":"\u003cp\u003eПодбросили две игральные кости. Какие из представленных ниже наборов событий образуют систему гипотез?\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e\u003col\u003e\n\u003cli\u003e\u003cspan class=\"math\"\u003e\\(H_1=\\{\\text{на первой кости выпало одно очко}\\},\\ldots,H_6=\\{\\text{на первой кости выпало шесть очков}\\}\\)\u003c/span\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003col start=\"2\"\u003e\n\u003cli\u003e\u003cspan class=\"math\"\u003e\\(H_1=\\{\\text{на обеих костях выпало по одному очку}\\},\\ldots,H_6=\\{\\text{на обеих костях выпало по шесть очков}\\}\\)\u003c/span\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003col start=\"3\"\u003e\n\u003cli\u003e\u003cspan class=\"math\"\u003e\\(H_1=\\{\\text{на первой кости выпало чётное число очков}\\}\\)\u003c/span\u003e, \u003cspan class=\"math\"\u003e\\(H_2=\\{\\text{на второй кости выпало нечётное число очков}\\}\\)\u003c/span\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003cli\u003e\u003col start=\"4\"\u003e\n\u003cli\u003e\u003cspan class=\"math\"\u003e\\(H_1=\\{\\text{на второй кости выпало чётное число очков}\\}\\)\u003c/span\u003e, \u003cspan class=\"math\"\u003e\\(H_2=\\{\\text{на второй кости выпало нечётное число очков}\\}\\)\u003c/span\u003e.\u003c/li\u003e\n\u003c/ol\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n","text":"Подбросили две игральные кости. Какие из представленных ниже наборов событий образуют систему гипотез? - 1. $H_1=\\{\\text{на первой кости выпало одно очко}\\},\\ldots,H_6=\\{\\text{на первой кости выпало шесть очков}\\}$. - 2. $H_1=\\{\\text{на обеих костях выпало по одному очку}\\},\\ldots,H_6=\\{\\text{на обеих костях выпало по шесть очков}\\}$. - 3. $H_1=\\{\\text{на первой кости выпало чётное число очков}\\}$, $H_2=\\{\\text{на второй кости выпало нечётное число очков}\\}$. - 4. $H_1=\\{\\text{на второй кости выпало чётное число очков}\\}$, $H_2=\\{\\text{на второй кости выпало нечётное число очков}\\}$."},{"id":"tvims3-125","no":54,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Из 30 билетов, включенных в программу экзамена, студент знает 5. Когда ему выгоднее сдавать экзамен первым или вторым (с точки зрения увеличения вероятности сдачи экзамена)?","html":"\u003cp\u003eИз 30 билетов, включенных в программу экзамена, студент знает 5. Когда ему выгоднее сдавать экзамен первым или вторым (с точки зрения увеличения вероятности сдачи экзамена)?\u003c/p\u003e\n","text":"Из 30 билетов, включенных в программу экзамена, студент знает 5. Когда ему выгоднее сдавать экзамен первым или вторым (с точки зрения увеличения вероятности сдачи экзамена)?"},{"id":"tvims3-126","no":55,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Две компании $X$ и $Y$ производят однотипную продукцию и конкурируют на рынке сбыта. Перед каждой из них стоит задача модификации производства. Существует два возможных пути изменения технологии: $A$ и $B$. Вероятность того, что компания $X$ выберет путь $A$, равна $0{,}4$. Для компании $Y$ эта вероятность равна $0{,}7$. Компании выбирают пути изменения технологии независимо друг от друга. В таблице приведены оценённые экспертами шансы на победу в конкурентной борьбе для компании $X$ в соответствии с выбором компаниями путей изменения технологии. Найти вероятность победы компании $X$ в конкурентной борьбе.\n\n   | $X\\backslash Y$ | $A$ | $B$ |\n   |:---:|:---:|:---:|\n   | $A$ | 5:3 | 2:1 |\n   | $B$ | 1:2 | 1:2 |","html":"\u003cp\u003eДве компании \u003cspan class=\"math\"\u003e\\(X\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(Y\\)\u003c/span\u003e производят однотипную продукцию и конкурируют на рынке сбыта. Перед каждой из них стоит задача модификации производства. Существует два возможных пути изменения технологии: \u003cspan class=\"math\"\u003e\\(A\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(B\\)\u003c/span\u003e. Вероятность того, что компания \u003cspan class=\"math\"\u003e\\(X\\)\u003c/span\u003e выберет путь \u003cspan class=\"math\"\u003e\\(A\\)\u003c/span\u003e, равна \u003cspan class=\"math\"\u003e\\(0{,}4\\)\u003c/span\u003e. Для компании \u003cspan class=\"math\"\u003e\\(Y\\)\u003c/span\u003e эта вероятность равна \u003cspan class=\"math\"\u003e\\(0{,}7\\)\u003c/span\u003e. Компании выбирают пути изменения технологии независимо друг от друга. В таблице приведены оценённые экспертами шансы на победу в конкурентной борьбе для компании \u003cspan class=\"math\"\u003e\\(X\\)\u003c/span\u003e в соответствии с выбором компаниями путей изменения технологии. Найти вероятность победы компании \u003cspan class=\"math\"\u003e\\(X\\)\u003c/span\u003e в конкурентной борьбе.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth style=\"text-align:center\"\u003e\u003cspan class=\"math\"\u003e\\(X\\backslash Y\\)\u003c/span\u003e\u003c/th\u003e\n  \u003cth style=\"text-align:center\"\u003e\u003cspan class=\"math\"\u003e\\(A\\)\u003c/span\u003e\u003c/th\u003e\n  \u003cth style=\"text-align:center\"\u003e\u003cspan class=\"math\"\u003e\\(B\\)\u003c/span\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd style=\"text-align:center\"\u003e\u003cspan class=\"math\"\u003e\\(A\\)\u003c/span\u003e\u003c/td\u003e\n  \u003ctd style=\"text-align:center\"\u003e5:3\u003c/td\u003e\n  \u003ctd style=\"text-align:center\"\u003e2:1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd style=\"text-align:center\"\u003e\u003cspan class=\"math\"\u003e\\(B\\)\u003c/span\u003e\u003c/td\u003e\n  \u003ctd style=\"text-align:center\"\u003e1:2\u003c/td\u003e\n  \u003ctd style=\"text-align:center\"\u003e1:2\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","text":"Две компании $X$ и $Y$ производят однотипную продукцию и конкурируют на рынке сбыта. Перед каждой из них стоит задача модификации производства. Существует два возможных пути изменения технологии: $A$ и $B$. Вероятность того, что компания $X$ выберет путь $A$, равна $0{,}4$. Для компании $Y$ эта вероятность равна $0{,}7$. Компании выбирают пути изменения технологии независимо друг от друга. В таблице приведены оценённые экспертами шансы на победу в конкурентной борьбе для компании $X$ в соответствии с выбором компаниями путей изменения технологии. Найти вероятность победы компании $X$ в конкурентной борьбе. | $X\\backslash Y$ | $A$ | $B$ | |:---:|:---:|:---:| | $A$ | 5:3 | 2:1 | | $B$ | 1:2 | 1:2 |"},{"id":"tvims3-127","no":56,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Подбрасываются две игральные кости. Образуют ли систему гипотез следующие события: $A=\\{\\text{на первой кости выпадет одно очко}\\}$, $B=\\{\\text{сумма очков на двух костях равна 9}\\}$?","html":"\u003cp\u003eПодбрасываются две игральные кости. Образуют ли систему гипотез следующие события: \u003cspan class=\"math\"\u003e\\(A=\\{\\text{на первой кости выпадет одно очко}\\}\\)\u003c/span\u003e, \u003cspan class=\"math\"\u003e\\(B=\\{\\text{сумма очков на двух костях равна 9}\\}\\)\u003c/span\u003e?\u003c/p\u003e\n","text":"Подбрасываются две игральные кости. Образуют ли систему гипотез следующие события: $A=\\{\\text{на первой кости выпадет одно очко}\\}$, $B=\\{\\text{сумма очков на двух костях равна 9}\\}$?"},{"id":"tvims3-128","no":57,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Пусть события $H_1,\\ldots,H_{10}$ образуют систему равновероятных гипотез. Найти $P(H_1+H_{10})$.","html":"\u003cp\u003eПусть события \u003cspan class=\"math\"\u003e\\(H_1,\\ldots,H_{10}\\)\u003c/span\u003e образуют систему равновероятных гипотез. Найти \u003cspan class=\"math\"\u003e\\(P(H_1+H_{10})\\)\u003c/span\u003e.\u003c/p\u003e\n","text":"Пусть события $H_1,\\ldots,H_{10}$ образуют систему равновероятных гипотез. Найти $P(H_1+H_{10})$."},{"id":"tvims3-129","no":58,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Может ли априорная вероятность гипотезы быть больше соответствующей апостериорной? Ответ обосновать.","html":"\u003cp\u003eМожет ли априорная вероятность гипотезы быть больше соответствующей апостериорной? Ответ обосновать.\u003c/p\u003e\n","text":"Может ли априорная вероятность гипотезы быть больше соответствующей апостериорной? Ответ обосновать."},{"id":"tvims3-130","no":59,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Два независимых претендента $Z$ и $L$ на пост губернатора края завершают предвыборную кампанию. Каждый из них, независимо от действий другого, может успеть выступить только в одном из городов $P$ и $M$. Эксперты-политологи считают, что выступления претендентов обязательно состоятся, и оценивают вероятность того, что $L$ предпочтёт город $P$, как равную $\\frac23$. Вероятности выбора городов $P$ и $M$ другим претендентом одинаковы. В таблице показано, как, по мнению экспертов, распределяются шансы $L$ по отношению к $Z$ одержать победу на выборах в зависимости от города выступления. Найти вероятность того, что победу одержит $L$.\n\n   | $Z\\backslash L$ | $P$ | $M$ |\n   |:---:|:---:|:---:|\n   | $P$ | 3:1 | 2:1 |\n   | $M$ | 1:1 | 1:2 | (задача со звёздочкой в источнике)","html":"\u003cp\u003eДва независимых претендента \u003cspan class=\"math\"\u003e\\(Z\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(L\\)\u003c/span\u003e на пост губернатора края завершают предвыборную кампанию. Каждый из них, независимо от действий другого, может успеть выступить только в одном из городов \u003cspan class=\"math\"\u003e\\(P\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(M\\)\u003c/span\u003e. Эксперты-политологи считают, что выступления претендентов обязательно состоятся, и оценивают вероятность того, что \u003cspan class=\"math\"\u003e\\(L\\)\u003c/span\u003e предпочтёт город \u003cspan class=\"math\"\u003e\\(P\\)\u003c/span\u003e, как равную \u003cspan class=\"math\"\u003e\\(\\frac23\\)\u003c/span\u003e. Вероятности выбора городов \u003cspan class=\"math\"\u003e\\(P\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(M\\)\u003c/span\u003e другим претендентом одинаковы. В таблице показано, как, по мнению экспертов, распределяются шансы \u003cspan class=\"math\"\u003e\\(L\\)\u003c/span\u003e по отношению к \u003cspan class=\"math\"\u003e\\(Z\\)\u003c/span\u003e одержать победу на выборах в зависимости от города выступления. Найти вероятность того, что победу одержит \u003cspan class=\"math\"\u003e\\(L\\)\u003c/span\u003e.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth style=\"text-align:center\"\u003e\u003cspan class=\"math\"\u003e\\(Z\\backslash L\\)\u003c/span\u003e\u003c/th\u003e\n  \u003cth style=\"text-align:center\"\u003e\u003cspan class=\"math\"\u003e\\(P\\)\u003c/span\u003e\u003c/th\u003e\n  \u003cth style=\"text-align:center\"\u003e\u003cspan class=\"math\"\u003e\\(M\\)\u003c/span\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd style=\"text-align:center\"\u003e\u003cspan class=\"math\"\u003e\\(P\\)\u003c/span\u003e\u003c/td\u003e\n  \u003ctd style=\"text-align:center\"\u003e3:1\u003c/td\u003e\n  \u003ctd style=\"text-align:center\"\u003e2:1\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e| \u003cspan class=\"math\"\u003e\\(M\\)\u003c/span\u003e | 1:1 | 1:2 | (задача со звёздочкой в источнике)\u003c/p\u003e\n","text":"Два независимых претендента $Z$ и $L$ на пост губернатора края завершают предвыборную кампанию. Каждый из них, независимо от действий другого, может успеть выступить только в одном из городов $P$ и $M$. Эксперты-политологи считают, что выступления претендентов обязательно состоятся, и оценивают вероятность того, что $L$ предпочтёт город $P$, как равную $\\frac23$. Вероятности выбора городов $P$ и $M$ другим претендентом одинаковы. В таблице показано, как, по мнению экспертов, распределяются шансы $L$ по отношению к $Z$ одержать победу на выборах в зависимости от города выступления. Найти вероятность того, что победу одержит $L$. | $Z\\backslash L$ | $P$ | $M$ | |:---:|:---:|:---:| | $P$ | 3:1 | 2:1 | | $M$ | 1:1 | 1:2 | (задача со звёздочкой в источнике)"},{"id":"tvims3-131","no":60,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"В ящике лежит 20 теннисных мячей, в том числе 12 новых и 8 игранных. Из ящика извлекают наугад два мяча для игры. После игры мячи возвращают обратно в ящик. После этого из ящика вынимают еще два мяча для следующей игры. Оба мяча оказались неигранными. Найти вероятность того, что первый раз тоже играли новыми мячами.","html":"\u003cp\u003eВ ящике лежит 20 теннисных мячей, в том числе 12 новых и 8 игранных. Из ящика извлекают наугад два мяча для игры. После игры мячи возвращают обратно в ящик. После этого из ящика вынимают еще два мяча для следующей игры. Оба мяча оказались неигранными. Найти вероятность того, что первый раз тоже играли новыми мячами.\u003c/p\u003e\n","text":"В ящике лежит 20 теннисных мячей, в том числе 12 новых и 8 игранных. Из ящика извлекают наугад два мяча для игры. После игры мячи возвращают обратно в ящик. После этого из ящика вынимают еще два мяча для следующей игры. Оба мяча оказались неигранными. Найти вероятность того, что первый раз тоже играли новыми мячами."},{"id":"tvims3-132","no":61,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"За истекший период в торговую фирму поступали телевизоры от трех фирм-поставщиков в следующей пропорции: 1:3:6. Каждая фирма дает на свои телевизоры гарантию, идентифицируя их по серийному номеру и дате поставки. Телевизоры первой фирмы-поставщика требуют ремонта в течение гарантийного срока в 15% случаев, второй и третьей – соответственно в 10% и 7% случаев. Проданный телевизор требует гарантийного ремонта, однако потеряны документы, идентифицирующие фирму- поставщика. В какую фирму имеет смысл обратиться в первую очередь?","html":"\u003cp\u003eЗа истекший период в торговую фирму поступали телевизоры от трех фирм-поставщиков в следующей пропорции: 1:3:6. Каждая фирма дает на свои телевизоры гарантию, идентифицируя их по серийному номеру и дате поставки. Телевизоры первой фирмы-поставщика требуют ремонта в течение гарантийного срока в 15% случаев, второй и третьей – соответственно в 10% и 7% случаев. Проданный телевизор требует гарантийного ремонта, однако потеряны документы, идентифицирующие фирму- поставщика. В какую фирму имеет смысл обратиться в первую очередь?\u003c/p\u003e\n","text":"За истекший период в торговую фирму поступали телевизоры от трех фирм-поставщиков в следующей пропорции: 1:3:6. Каждая фирма дает на свои телевизоры гарантию, идентифицируя их по серийному номеру и дате поставки. Телевизоры первой фирмы-поставщика требуют ремонта в течение гарантийного срока в 15% случаев, второй и третьей – соответственно в 10% и 7% случаев. Проданный телевизор требует гарантийного ремонта, однако потеряны документы, идентифицирующие фирму- поставщика. В какую фирму имеет смысл обратиться в первую очередь?"},{"id":"tvims3-133","no":62,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Можно ли для нахождения вероятности события, связанного с опытом, сводящимся к схеме случаев, использовать формулу полной вероятности? Ответ обосновать.","html":"\u003cp\u003eМожно ли для нахождения вероятности события, связанного с опытом, сводящимся к схеме случаев, использовать формулу полной вероятности? Ответ обосновать.\u003c/p\u003e\n","text":"Можно ли для нахождения вероятности события, связанного с опытом, сводящимся к схеме случаев, использовать формулу полной вероятности? Ответ обосновать."},{"id":"tvims3-134","no":63,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Может ли сумма всех априорных вероятностей гипотез оказаться больше суммы всех апостериорных вероятностей этих гипотез? Ответ обосновать.","html":"\u003cp\u003eМожет ли сумма всех априорных вероятностей гипотез оказаться больше суммы всех апостериорных вероятностей этих гипотез? Ответ обосновать.\u003c/p\u003e\n","text":"Может ли сумма всех априорных вероятностей гипотез оказаться больше суммы всех апостериорных вероятностей этих гипотез? Ответ обосновать."},{"id":"tvims3-135","no":64,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Могут ли апостериорные вероятности всех гипотез, кроме одной, оказаться нулевыми, если априорные вероятности этих гипотез одинаковы? Ответ обосновать.","html":"\u003cp\u003eМогут ли апостериорные вероятности всех гипотез, кроме одной, оказаться нулевыми, если априорные вероятности этих гипотез одинаковы? Ответ обосновать.\u003c/p\u003e\n","text":"Могут ли апостериорные вероятности всех гипотез, кроме одной, оказаться нулевыми, если априорные вероятности этих гипотез одинаковы? Ответ обосновать."},{"id":"tvims3-136","no":65,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Пусть события $H_1,H_2,H_3$ образуют систему равновероятных гипотез. Произошло событие $H_1$. Вычислить апостериорные вероятности всех гипотез.","html":"\u003cp\u003eПусть события \u003cspan class=\"math\"\u003e\\(H_1,H_2,H_3\\)\u003c/span\u003e образуют систему равновероятных гипотез. Произошло событие \u003cspan class=\"math\"\u003e\\(H_1\\)\u003c/span\u003e. Вычислить апостериорные вероятности всех гипотез.\u003c/p\u003e\n","text":"Пусть события $H_1,H_2,H_3$ образуют систему равновероятных гипотез. Произошло событие $H_1$. Вычислить апостериорные вероятности всех гипотез."},{"id":"tvims3-137","no":66,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Вывести из формулы полной вероятности классическую формулу вычисления вероятности.","html":"\u003cp\u003eВывести из формулы полной вероятности классическую формулу вычисления вероятности.\u003c/p\u003e\n","text":"Вывести из формулы полной вероятности классическую формулу вычисления вероятности."},{"id":"tvims3-138","no":67,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Завод изготавливает изделия, каждое из которых с вероятностью $p$ имеет дефект. В цехе изделия осматриваются с равными вероятностями одним из двух контролёров. Первый обнаруживает имеющиеся дефекты с вероятностью $p_1$, а второй — с вероятностью $p_2$. Известно, что одно из изделий забраковано. Найти вероятность того, что оно забраковано: а) первым контролёром; б) вторым контролёром.","html":"\u003cp\u003eЗавод изготавливает изделия, каждое из которых с вероятностью \u003cspan class=\"math\"\u003e\\(p\\)\u003c/span\u003e имеет дефект. В цехе изделия осматриваются с равными вероятностями одним из двух контролёров. Первый обнаруживает имеющиеся дефекты с вероятностью \u003cspan class=\"math\"\u003e\\(p_1\\)\u003c/span\u003e, а второй — с вероятностью \u003cspan class=\"math\"\u003e\\(p_2\\)\u003c/span\u003e. Известно, что одно из изделий забраковано. Найти вероятность того, что оно забраковано: а) первым контролёром; б) вторым контролёром.\u003c/p\u003e\n","text":"Завод изготавливает изделия, каждое из которых с вероятностью $p$ имеет дефект. В цехе изделия осматриваются с равными вероятностями одним из двух контролёров. Первый обнаруживает имеющиеся дефекты с вероятностью $p_1$, а второй — с вероятностью $p_2$. Известно, что одно из изделий забраковано. Найти вероятность того, что оно забраковано: а) первым контролёром; б) вторым контролёром."},{"id":"tvims3-139","no":68,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Для подготовки к экзамену студенту предложено 20 вопросов. Билет содержит два вопроса. Комплектование билетов вопросами осуществляется случайным образом. Студент подготовил 15 вопросов. Найти вероятность того, что он сдаст экзамен, если для этого достаточно ответить правильно на два вопроса своего билета или на один вопрос своего билета и один вопрос по выбору преподавателя.","html":"\u003cp\u003eДля подготовки к экзамену студенту предложено 20 вопросов. Билет содержит два вопроса. Комплектование билетов вопросами осуществляется случайным образом. Студент подготовил 15 вопросов. Найти вероятность того, что он сдаст экзамен, если для этого достаточно ответить правильно на два вопроса своего билета или на один вопрос своего билета и один вопрос по выбору преподавателя.\u003c/p\u003e\n","text":"Для подготовки к экзамену студенту предложено 20 вопросов. Билет содержит два вопроса. Комплектование билетов вопросами осуществляется случайным образом. Студент подготовил 15 вопросов. Найти вероятность того, что он сдаст экзамен, если для этого достаточно ответить правильно на два вопроса своего билета или на один вопрос своего билета и один вопрос по выбору преподавателя."},{"id":"tvims3-140","no":69,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"На предприятии работают 10 рабочих шестого разряда, 15 рабочих пятого разряда и 5 рабочих четвертого разряда. Вероятность того, что изделие, изготовленное рабочим соответствующего разряда, будет одобрено ОТК равна соответственно 0,95, 0,9 и 0,8. Найти вероятность того, что изделие, проверенное ОТК, будет одобрено, при условии, что производительность всех рабочих одинакова.","html":"\u003cp\u003eНа предприятии работают 10 рабочих шестого разряда, 15 рабочих пятого разряда и 5 рабочих четвертого разряда. Вероятность того, что изделие, изготовленное рабочим соответствующего разряда, будет одобрено ОТК равна соответственно 0,95, 0,9 и 0,8. Найти вероятность того, что изделие, проверенное ОТК, будет одобрено, при условии, что производительность всех рабочих одинакова.\u003c/p\u003e\n","text":"На предприятии работают 10 рабочих шестого разряда, 15 рабочих пятого разряда и 5 рабочих четвертого разряда. Вероятность того, что изделие, изготовленное рабочим соответствующего разряда, будет одобрено ОТК равна соответственно 0,95, 0,9 и 0,8. Найти вероятность того, что изделие, проверенное ОТК, будет одобрено, при условии, что производительность всех рабочих одинакова."},{"id":"tvims3-141","no":70,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Представители двух фракций Государственной Думы ($R$ и $L$) претендуют на пост председателя вновь создаваемого комитета. Согласно утверждённому регламенту, выборы должны проводиться альтернативным голосованием по двум кандидатурам (по одной от каждой фракции). У каждой фракции есть по две кандидатуры, обладающие равными шансами быть выдвинутыми в качестве претендента на этот пост. Эксперты оценили шансы фракции $R$ по отношению к $L$ получить пост председателя комитета в зависимости от предложенных кандидатур $L_i,R_i$, $i=1,2$ (см. таблицу). Найти вероятность того, что победу одержит фракция $L$.\n\n   | $R\\backslash L$ | $L_1$ | $L_2$ |\n   |:---:|:---:|:---:|\n   | $R_1$ | 1:3 | 3:2 |\n   | $R_2$ | 2:1 | 1:2 |","html":"\u003cp\u003eПредставители двух фракций Государственной Думы (\u003cspan class=\"math\"\u003e\\(R\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(L\\)\u003c/span\u003e) претендуют на пост председателя вновь создаваемого комитета. Согласно утверждённому регламенту, выборы должны проводиться альтернативным голосованием по двум кандидатурам (по одной от каждой фракции). У каждой фракции есть по две кандидатуры, обладающие равными шансами быть выдвинутыми в качестве претендента на этот пост. Эксперты оценили шансы фракции \u003cspan class=\"math\"\u003e\\(R\\)\u003c/span\u003e по отношению к \u003cspan class=\"math\"\u003e\\(L\\)\u003c/span\u003e получить пост председателя комитета в зависимости от предложенных кандидатур \u003cspan class=\"math\"\u003e\\(L_i,R_i\\)\u003c/span\u003e, \u003cspan class=\"math\"\u003e\\(i=1,2\\)\u003c/span\u003e (см. таблицу). Найти вероятность того, что победу одержит фракция \u003cspan class=\"math\"\u003e\\(L\\)\u003c/span\u003e.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth style=\"text-align:center\"\u003e\u003cspan class=\"math\"\u003e\\(R\\backslash L\\)\u003c/span\u003e\u003c/th\u003e\n  \u003cth style=\"text-align:center\"\u003e\u003cspan class=\"math\"\u003e\\(L_1\\)\u003c/span\u003e\u003c/th\u003e\n  \u003cth style=\"text-align:center\"\u003e\u003cspan class=\"math\"\u003e\\(L_2\\)\u003c/span\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd style=\"text-align:center\"\u003e\u003cspan class=\"math\"\u003e\\(R_1\\)\u003c/span\u003e\u003c/td\u003e\n  \u003ctd style=\"text-align:center\"\u003e1:3\u003c/td\u003e\n  \u003ctd style=\"text-align:center\"\u003e3:2\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd style=\"text-align:center\"\u003e\u003cspan class=\"math\"\u003e\\(R_2\\)\u003c/span\u003e\u003c/td\u003e\n  \u003ctd style=\"text-align:center\"\u003e2:1\u003c/td\u003e\n  \u003ctd style=\"text-align:center\"\u003e1:2\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","text":"Представители двух фракций Государственной Думы ($R$ и $L$) претендуют на пост председателя вновь создаваемого комитета. Согласно утверждённому регламенту, выборы должны проводиться альтернативным голосованием по двум кандидатурам (по одной от каждой фракции). У каждой фракции есть по две кандидатуры, обладающие равными шансами быть выдвинутыми в качестве претендента на этот пост. Эксперты оценили шансы фракции $R$ по отношению к $L$ получить пост председателя комитета в зависимости от предложенных кандидатур $L_i,R_i$, $i=1,2$ (см. таблицу). Найти вероятность того, что победу одержит фракция $L$. | $R\\backslash L$ | $L_1$ | $L_2$ | |:---:|:---:|:---:| | $R_1$ | 1:3 | 3:2 | | $R_2$ | 2:1 | 1:2 |"},{"id":"tvims3-142","no":71,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"На склад поступила однотипная продукция с трех фабрик. Объемы поставок относятся соответственно как 1:2:7. Известно, что нестандартных изделий среди продукции первой фабрики – 3%, второй – 2%, третьей – 1%. Найти вероятности следующих событий: взятое наугад со склада изделие окажется нестандартным; взятое наугад со склада изделие произведено первой фабрикой, если известно, что оно оказалось нестандартным.","html":"\u003cp\u003eНа склад поступила однотипная продукция с трех фабрик. Объемы поставок относятся соответственно как 1:2:7. Известно, что нестандартных изделий среди продукции первой фабрики – 3%, второй – 2%, третьей – 1%. Найти вероятности следующих событий: взятое наугад со склада изделие окажется нестандартным; взятое наугад со склада изделие произведено первой фабрикой, если известно, что оно оказалось нестандартным.\u003c/p\u003e\n","text":"На склад поступила однотипная продукция с трех фабрик. Объемы поставок относятся соответственно как 1:2:7. Известно, что нестандартных изделий среди продукции первой фабрики – 3%, второй – 2%, третьей – 1%. Найти вероятности следующих событий: взятое наугад со склада изделие окажется нестандартным; взятое наугад со склада изделие произведено первой фабрикой, если известно, что оно оказалось нестандартным."},{"id":"tvims3-143","no":72,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Имеется ящик, в котором лежат 20 коробок по 10 карандашей. При вскрытии ящика 4 коробки уронили, и грифели карандашей в них сломались. Однако все 20 коробок были сданы на склад, откуда затем взяли 2 коробки и раздали карандаши ученикам. Найти вероятность того, что доставшийся ученику карандаш имеет сломанный грифель.","html":"\u003cp\u003eИмеется ящик, в котором лежат 20 коробок по 10 карандашей. При вскрытии ящика 4 коробки уронили, и грифели карандашей в них сломались. Однако все 20 коробок были сданы на склад, откуда затем взяли 2 коробки и раздали карандаши ученикам. Найти вероятность того, что доставшийся ученику карандаш имеет сломанный грифель.\u003c/p\u003e\n","text":"Имеется ящик, в котором лежат 20 коробок по 10 карандашей. При вскрытии ящика 4 коробки уронили, и грифели карандашей в них сломались. Однако все 20 коробок были сданы на склад, откуда затем взяли 2 коробки и раздали карандаши ученикам. Найти вероятность того, что доставшийся ученику карандаш имеет сломанный грифель."},{"id":"tvims3-144","no":73,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Две машинистки печатали рукопись, посменно заменяя друг друга. Первая в конечном итоге напечатала $\\frac13$ всей рукописи, а вторая — остальное. Первая машинистка делает ошибки с вероятностью $0{,}15$, а вторая — с вероятностью $0{,}1$. При проверке на 13-й странице обнаружена ошибка. Найти вероятность того, что ошиблась первая машинистка.","html":"\u003cp\u003eДве машинистки печатали рукопись, посменно заменяя друг друга. Первая в конечном итоге напечатала \u003cspan class=\"math\"\u003e\\(\\frac13\\)\u003c/span\u003e всей рукописи, а вторая — остальное. Первая машинистка делает ошибки с вероятностью \u003cspan class=\"math\"\u003e\\(0{,}15\\)\u003c/span\u003e, а вторая — с вероятностью \u003cspan class=\"math\"\u003e\\(0{,}1\\)\u003c/span\u003e. При проверке на 13-й странице обнаружена ошибка. Найти вероятность того, что ошиблась первая машинистка.\u003c/p\u003e\n","text":"Две машинистки печатали рукопись, посменно заменяя друг друга. Первая в конечном итоге напечатала $\\frac13$ всей рукописи, а вторая — остальное. Первая машинистка делает ошибки с вероятностью $0{,}15$, а вторая — с вероятностью $0{,}1$. При проверке на 13-й странице обнаружена ошибка. Найти вероятность того, что ошиблась первая машинистка."},{"id":"tvims3-145","no":74,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Пассажир может обратиться за получением билета в одну из трёх касс. Вероятности обращения в каждую кассу зависят от их местоположения и равны соответственно $p_1=\\frac13$, $p_2=\\frac16$, $p_3=\\frac12$. Вероятность того, что к моменту прихода пассажира билеты, имевшиеся в кассе, будут распроданы, для первой кассы равна $P_1=\\frac34$, для второй — $P_2=\\frac12$, для третьей — $P_3=\\frac23$. Пассажир направился в одну из касс и приобрёл билет. Найти вероятность того, что это была первая касса.","html":"\u003cp\u003eПассажир может обратиться за получением билета в одну из трёх касс. Вероятности обращения в каждую кассу зависят от их местоположения и равны соответственно \u003cspan class=\"math\"\u003e\\(p_1=\\frac13\\)\u003c/span\u003e, \u003cspan class=\"math\"\u003e\\(p_2=\\frac16\\)\u003c/span\u003e, \u003cspan class=\"math\"\u003e\\(p_3=\\frac12\\)\u003c/span\u003e. Вероятность того, что к моменту прихода пассажира билеты, имевшиеся в кассе, будут распроданы, для первой кассы равна \u003cspan class=\"math\"\u003e\\(P_1=\\frac34\\)\u003c/span\u003e, для второй — \u003cspan class=\"math\"\u003e\\(P_2=\\frac12\\)\u003c/span\u003e, для третьей — \u003cspan class=\"math\"\u003e\\(P_3=\\frac23\\)\u003c/span\u003e. Пассажир направился в одну из касс и приобрёл билет. Найти вероятность того, что это была первая касса.\u003c/p\u003e\n","text":"Пассажир может обратиться за получением билета в одну из трёх касс. Вероятности обращения в каждую кассу зависят от их местоположения и равны соответственно $p_1=\\frac13$, $p_2=\\frac16$, $p_3=\\frac12$. Вероятность того, что к моменту прихода пассажира билеты, имевшиеся в кассе, будут распроданы, для первой кассы равна $P_1=\\frac34$, для второй — $P_2=\\frac12$, для третьей — $P_3=\\frac23$. Пассажир направился в одну из касс и приобрёл билет. Найти вероятность того, что это была первая касса."},{"id":"tvims3-146","no":75,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"На экзамен пришли 10 студентов. Трое из них подготовлены отлично, четверо – хорошо, двое – удовлетворительно, один – плохо. В экзаменационных билетах имеется 20 вопросов. Отлично подготовленный студент может ответить на все 20 вопросов, хорошо подготовленный – на 16, удовлетворительно – на 10, плохо – на 5. Студент, сдавший экзамен, ответил на все три заданных вопроса. Найти вероятность того, что этот студент подготовлен: отлично; плохо.","html":"\u003cp\u003eНа экзамен пришли 10 студентов. Трое из них подготовлены отлично, четверо – хорошо, двое – удовлетворительно, один – сти возникновения заболевания, в зависимости от категории больных, равны соответственно 0,12, 0,09, 0,2. Найти: а) вероятность возникновения заболевания у наугад выбранного пациента диспансера; б) вероятность принадлежности к третьей категории больных пациента диспансера, у которого обнаружено заболевание."},{"id":"tvims3-148","no":77,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Два независимых претендента $Z$ и $L$ на пост губернатора края завершают предвыборную кампанию. Каждый из них независимо от другого может успеть выступить только в одном из городов $P$ и $M$. Эксперты-политологи оценивают вероятность того, что $L$ предпочтет город $P$, как $\\frac23$. Вероятности выбора городов $P$ и $M$ другим претендентом одинаковы. В таблице показаны шансы $L$ по отношению к $Z$ одержать победу на выборах в зависимости от города выступления. Найти вероятность того, что оба претендента выступили в городе $P$, если известно, что победу одержал $Z$.\n\n   | $Z\\backslash L$ | $P$ | $M$ |\n   |:---:|:---:|:---:|\n   | $P$ | 4:3 | 3:1 |\n   | $M$ | 1:1 | 1:3 |","html":"\u003cp\u003eДва независимых претендента \u003cspan class=\"math\"\u003e\\(Z\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(L\\)\u003c/span\u003e на пост губернатора края завершают предвыборную кампанию. Каждый из них независимо от другого может успеть выступить только в одном из городов \u003cspan class=\"math\"\u003e\\(P\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(M\\)\u003c/span\u003e. Эксперты-политологи оценивают вероятность того, что \u003cspan class=\"math\"\u003e\\(L\\)\u003c/span\u003e предпочтет город \u003cspan class=\"math\"\u003e\\(P\\)\u003c/span\u003e, как \u003cspan class=\"math\"\u003e\\(\\frac23\\)\u003c/span\u003e. Вероятности выбора городов \u003cspan class=\"math\"\u003e\\(P\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(M\\)\u003c/span\u003e другим претендентом одинаковы. В таблице показаны шансы \u003cspan class=\"math\"\u003e\\(L\\)\u003c/span\u003e по отношению к \u003cspan class=\"math\"\u003e\\(Z\\)\u003c/span\u003e одержать победу на выборах в зависимости от города выступления. Найти вероятность того, что оба претендента выступили в городе \u003cspan class=\"math\"\u003e\\(P\\)\u003c/span\u003e, если известно, что победу одержал \u003cspan class=\"math\"\u003e\\(Z\\)\u003c/span\u003e.\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n  \u003cth style=\"text-align:center\"\u003e\u003cspan class=\"math\"\u003e\\(Z\\backslash L\\)\u003c/span\u003e\u003c/th\u003e\n  \u003cth style=\"text-align:center\"\u003e\u003cspan class=\"math\"\u003e\\(P\\)\u003c/span\u003e\u003c/th\u003e\n  \u003cth style=\"text-align:center\"\u003e\u003cspan class=\"math\"\u003e\\(M\\)\u003c/span\u003e\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n  \u003ctd style=\"text-align:center\"\u003e\u003cspan class=\"math\"\u003e\\(P\\)\u003c/span\u003e\u003c/td\u003e\n  \u003ctd style=\"text-align:center\"\u003e4:3\u003c/td\u003e\n  \u003ctd style=\"text-align:center\"\u003e3:1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n  \u003ctd style=\"text-align:center\"\u003e\u003cspan class=\"math\"\u003e\\(M\\)\u003c/span\u003e\u003c/td\u003e\n  \u003ctd style=\"text-align:center\"\u003e1:1\u003c/td\u003e\n  \u003ctd style=\"text-align:center\"\u003e1:3\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n","text":"Два независимых претендента $Z$ и $L$ на пост губернатора края завершают предвыборную кампанию. Каждый из них независимо от другого может успеть выступить только в одном из городов $P$ и $M$. Эксперты-политологи оценивают вероятность того, что $L$ предпочтет город $P$, как $\\frac23$. Вероятности выбора городов $P$ и $M$ другим претендентом одинаковы. В таблице показаны шансы $L$ по отношению к $Z$ одержать победу на выборах в зависимости от города выступления. Найти вероятность того, что оба претендента выступили в городе $P$, если известно, что победу одержал $Z$. | $Z\\backslash L$ | $P$ | $M$ | |:---:|:---:|:---:| | $P$ | 4:3 | 3:1 | | $M$ | 1:1 | 1:3 |"},{"id":"tvims3-149","no":78,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"В урне находятся 4 белых и 6 чёрных шаров. Из неё три раза наугад вынимают по одному шару. Требуется найти вероятность того, что все три вынутых шара окажутся белыми (событие $A$), при выполнении двух разных условий: а) извлечённые из урны шары обратно не возвращаются; б) после каждого извлечения шар возвращается обратно.","html":"\u003cp\u003eВ урне находятся 4 белых и 6 чёрных шаров. Из неё три раза наугад вынимают по одному шару. Требуется найти вероятность того, что все три вынутых шара окажутся белыми (событие \u003cspan class=\"math\"\u003e\\(A\\)\u003c/span\u003e), при выполнении двух разных условий: а) извлечённые из урны шары обратно не возвращаются; б) после каждого извлечения шар возвращается обратно.\u003c/p\u003e\n","text":"В урне находятся 4 белых и 6 чёрных шаров. Из неё три раза наугад вынимают по одному шару. Требуется найти вероятность того, что все три вынутых шара окажутся белыми (событие $A$), при выполнении двух разных условий: а) извлечённые из урны шары обратно не возвращаются; б) после каждого извлечения шар возвращается обратно."},{"id":"tvims3-150","no":79,"source":"Учебник · Теория · § 4. Задачи для самостоятельного решения","group":"§ 4. Задачи для самостоятельного решения","raw":"Три радиостанции независимо друг от друга передают самолёту один и тот же сигнал. Вероятности того, что самолётом будут приняты эти сигналы, соответственно равны $0{,}9$, $0{,}8$, $0{,}75$. Найти вероятность того, что самолёт примет посылаемый ему сигнал.","html":"\u003cp\u003eТри радиостанции независимо друг от друга передают самолёту один и тот же сигнал. Вероятности того, что самолётом будут приняты эти сигналы, соответственно ра ы один раз.\u003c/li\u003e\n\u003c/ul\u003e\n","text":"В среднем каждый десятый договор страховой компании завершается выплатой по страховому случаю. Компания заключила пять договоров. Найдите вероятность того, что страховой случай наступит: - а) ровно один раз; - б) хотя бы один раз."},{"id":"tvims3-170","no":5,"source":"Семинары Игнатова · Семинар 4 (25.09.2026)","group":"Семинар 4 (25.09.2026)","raw":"На семейном совете решили, что дети будут рождаться до появления второго мальчика. Найдите вероятность того, что в семье будет четверо детей, если вероятность рождения мальчика равна $0{,}515$.","html":"\u003cp\u003eНа семейном совете решили, что дети будут рождаться до появления второго мальчика. Найдите вероятность того, что в семье будет четверо детей, если вероятность рождения мальчика равна \u003cspan class=\"math\"\u003e\\(0{,}515\\)\u003c/span\u003e.\u003c/p\u003e\n","text":"На семейном совете решили, что дети будут рождаться до появления второго мальчика. Найдите вероятность того, что в семье будет четверо детей, если вероятность рождения мальчика равна $0{,}515$."},{"id":"tvims3-171","no":6,"source":"Семинары Игнатова · Семинар 4 (25.09.2026)","group":"Семинар 4 (25.09.2026)","raw":"Торговое предприятие лишается лицензии, как только торговая инспекция в третий раз обнаруживает серьёзное нарушение правил торговли. Найдите вероятность того, что лицензия будет отобрана после пятой проверки. Известно, что вероятность обнаружения нарушения при одной проверке равна $2$ и не зависит от результатов предыдущих проверок.","html":"\u003cp\u003eТорговое предприятие лишается лицензии, как только торговая инспекция в третий раз обнаруживает серьёзное нарушение правил торговли. Найдите вероятность того, что лицензия будет отобрана после пятой проверки. Известно, что вероятность обнаружения нарушения при одной проверке равна \u003cspan class=\"math\"\u003e\\(2\\)\u003c/span\u003e и не зависит от результатов предыдущих проверок.\u003c/p\u003e\n","text":"Торговое предприятие 173","no":2,"source":"Семинары Игнатова · Семинар 5 (02.10.2026)","group":"Семинар 5 (02.10.2026)","raw":"На склад поступила однотипная продукция трёх фабрик. Вторая фабрика поставила на 100% больше изделий, чем первая, а третья произвела и поставила в $3{,}5$ раза больше изделий, чем вторая. Доля нестандартных изделий в продукции первой фабрики составляет 3%, второй — 2%, третьей — 1%. Найдите вероятности следующих событий:\n\n   - а) наугад выбранное со склада изделие окажется стандартным;\n   - б) наугад выбранное изделие произведено первой фабрикой, если известно, что оно нестандартное.","html":"\u003cp\u003eНа склад поступила однотипная продукция трёх фабрик. Вторая фабрика поставила на 100% больше изделий, чем первая, а третья произвела и поставила в \u003cspan class=\"math\"\u003e\\(3{,}5\\)\u003c/span\u003e раза больше изделий, чем вторая. Доля нестандартных изделий в продукции первой фабрики составляет 3%, второй — 2%, третьей — 1%. Найдите вероятности следующих событий:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eа) наугад выбранное со склада изделие окажется стандартным;\u003c/li\u003e\n\u003cli\u003eб) наугад выбранное изделие произведено первой фабрикой, если известно, что оно нестандартное.\u003c/li\u003e\n\u003c/ul\u003e\n","text":"На склад поступила однотипная продукция трёх фабрик. Вторая фабрика поставила на 100% больше изделий, чем первая, а третья произвела и поставила в $3{,}5$ раза больше изделий, чем вторая. Доля нестандартных изделий в продукции первой фабрики составляет 3%, второй — 2%, третьей — 1%. Найдите вероятности следующих событий: - а) наугад выбранное со склада изделие окажется стандартным; - б) наугад выбранное изделие произведено первой фабрикой, если известно, что оно нестандартное."},{"id":"tvims3-174","no":3,"source":"Семинары Игнатова · Семинар 5 (02.10.2026)","group":"Семинар 5 (02.10.2026)","raw":"Имеется пять урн. В двух из них лежит по одному белому и три чёрных шара, а в трёх остальных — по два белых и два чёрных шара. Н а затем взяли две коробки и раздали карандаши ученикам. Найдите вероятность того, что доставшийся ученику карандаш имеет разбитый грифель."},{"id":"naumov-v2-1","no":1,"source":"Слитая КР Наумова: Вариант 2","group":"Вариант 2","raw":"Известно, что $P(AB)=P(B)=\\frac12$. Верно ли, что $P(A\\mid B)\\ge P(B\\mid A)$?","html":"\u003cp\u003eИзвестно, что \u003cspan class=\"math\"\u003e\\(P(AB)=P(B)=\\frac12\\)\u003c/span\u003e. Верно ли, что \u003cspan class=\"math\"\u003e\\(P(A\\mid B)\\ge P(B\\mid A)\\)\u003c/span\u003e?\u003c/p\u003e\n","text":"Известно, что $P(AB)=P(B)=\\frac12$. Верно ли, что $P(A\\mid B)\\ge P(B\\mid A)$?"},{"id":"naumov-v2-2","no":2,"source":"Слитая КР Наумова: Вариант 2","group":"Вариант 2","raw":"Игральную кость бросают дважды. Событие $A=\\{\\text{при первом броске выпало пять очков}\\}$, событие $B=\\{\\text{сумма очков при двух бросках равна девяти}\\}$. Зависимы ли события $A$ и $B$? Обоснуйте ответ.","html":"\u003cp\u003eИгральную кость бросают дважды. Событие \u003cspan class=\"math\"\u003e\\(A=\\{\\text{при первом броске выпало пять очков}\\}\\)\u003c/span\u003e, событие \u003cspan class=\"math\"\u003e\\(B=\\{\\text{сумма очков при двух бросках равна девяти}\\}\\)\u003c/span\u003e. Зависимы ли события \u003cspan class=\"math\"\u003e\\(A\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(B\\)\u003c/span\u003e? Обоснуйте ответ.\u003c/p\u003e\n","text":"Игральную кость бросают дважды. Событие $A=\\{\\text{при первом броске выпало пять очков}\\}$, событие $B=\\{\\text{сумма очков при двух бросках равна девяти}\\}$. Зависимы ли события $A$ и $B$? Обоснуйте ответ."},{"id":"naumov-v2-3","no":3,"source":"Слитая КР Наумова: Вариант 2","group":"Вариант 2","raw":"Пусть $H_1,\\ldots,H_{10}$ — равновероятные гипотезы. Произошло событие $A=H_1+H_3$. Найдите $P(H_1+H_5+H_{10}\\mid A)$.","html":"\u003cp\u003eПусть \u003cspan class=\"math\"\u003e\\(H_1,\\ldots,H_{10}\\)\u003c/span\u003e — равновероятные гипотезы. Произошло событие \u003cspan class=\"math\"\u003e\\(A=H_1+H_3\\)\u003c/span\u003e. Найдите \u003cspan class=\"math\"\u003e\\(P(H_1+H_5+H_{10}\\mid A)\\)\u003c/span\u003e.\u003c/p\u003e\n","text":"Пусть $H_1,\\ldots,H_{10}$ — равновероятные гипотезы. Произошло событие $A=H_1+H_3$. Найдите $P(H_1+H_5+H_{10}\\mid A)$."},{"id":"naumov-v2-4","no":4,"source":"Слитая КР Наумова: Вариант 2","group":"Вариант 2","raw":"Монету подбрасывают до появления третьего герба. Найдите вероятность того, что монету придётся подбросить ровно семь раз.","html":"\u003cp\u003eМонету подбрасывают до появления третьего герба. Найдите вероятность того, что монету придётся подбросить ровно семь раз.\u003c/p\u003e\n","text":"Монету подбрасывают до появления третьего герба. Найдите вероятность того, что монету придётся подбросить ровно семь раз."},{"id":"naumov-v2-5","no":5,"source":"Слитая КР Наумова: Вариант 2","group":"Вариант 2","raw":"В ящике лежат 20 теннисных мячей, в том числе 15 новых и 5 игранных. Из ящика наугад извлекают два мяча для игры и после игры возвращают их в ящик. Затем из ящика наугад извлекают два мяча для следующей игры. Найдите вероятность того, что один из этих мячей окажется новым, а другой — игранным.","html":"\u003cp\u003eВ ящике лежат 20 теннисных мячей, в том числе 15 новых и 5 игранных. Из ящика наугад извлекают два мяча для игры и после игры возвращают их в ящик. Затем из ящика наугад извлекают два мяча для следующей игры. Найдите вероятность того, что один из этих мячей окажется новым, а другой — игранным.\u003c/p\u003e\n","text":"В ящике лежат 20 теннисных мячей, в том числе 15 новых и 5 игранных. Из ящика наугад извлекают два мяча для игры и после игры возвращают их в ящик. Затем из ящика наугад извлекают два мяча для следующей игры. Найдите вероятность того, что один из этих мячей окажется новым, а другой — игранным."},{"id":"naumov-v3-1","no":1,"source":"Слитая КР Наумова: Вариант 3","group":"Вариант 3","raw":"События $A$ и $B$ имеют вероятности $P(A)=P(B)=\\frac14$. В каком случае вероятность $P(A+B)$ больше: если события независимы или если они несовместны?","html":"\u003cp\u003eСобытия \u003cspan class=\"math\"\u003e\\(A\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(B\\)\u003c/span\u003e имеют вероятности \u003cspan class=\"math\"\u003e\\(P(A)=P(B)=\\frac14\\)\u003c/span\u003e. В каком случае вероятность \u003cspan class=\"math\"\u003e\\(P(A+B)\\)\u003c/span\u003e больше: если события независимы или если они несовместны?\u003c/p\u003e\n","text":"События $A$ и $B$ имеют вероятности $P(A)=P(B)=\\frac14$. В каком случае вероятность $P(A+B)$ больше: если события независимы или если они несовместны?"},{"id":"naumov-v3-2","no":2,"source":"Слитая КР Наумова: Вариант 3","group":"Вариант 3","raw":"В двух коробках находится по 100 резисторов. В первой коробке 10 бракованных резисторов, во второй — 20. Наугад выбирают один резистор из двух коробок. Проверьте независимость событий $A=\\{\\text{резистор взят из первой коробки}\\}$ и $B=\\{\\text{резистор бракованный}\\}$.","html":"\u003cp\u003eВ двух коробках находится по 100 резисторов. В первой коробке 10 бракованных резисторов, во второй — 20. Наугад выбирают один резистор из двух коробок. Проверьте независимость событий \u003cspan class=\"math\"\u003e\\(A=\\{\\text{резистор взят из первой коробки}\\}\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(B=\\{\\text{резистор бракованный}\\}\\)\u003c/span\u003e.\u003c/p\u003e\n","text":"В двух коробках находится по 100 резисторов. В первой коробке 10 бракованных резисторов, во второй — 20. Наугад выбирают один резистор из двух коробок. Проверьте независимость событий $A=\\{\\text{резистор взят из первой коробки}\\}$ и $B=\\{\\text{резистор бракованный}\\}$."},{"id":"naumov-v3-3","no":3,"source":"Слитая КР Наумова: Вариант 3","group":"Вариант 3","raw":"Из цифр $1,2,3,4,5,6$ наугад составляют пятизначное число без повторения цифр. Найдите вероятность того, что полученное число окажется чётным.","html":"\u003cp\u003eИз цифр \u003cspan class=\"math\"\u003e\\(1,2,3,4,5,6\\)\u003c/span\u003e наугад составляют пятизначное число без повторения цифр. Найдите вероятность того, что полученное число окажется чётным.\u003c/p\u003e\n","text":"Из цифр $1,2,3,4,5,6$ наугад составляют пятизначное число без повторения цифр. Найдите вероятность того, что полученное число окажется чётным."},{"id":"naumov-v3-4","no":4,"source":"Слитая КР Наумова: Вариант 3","group":"Вариант 3","raw":"Техническая служба располагает девятью машинами. Вероятность исправной работы каждой машины равна $0{,}9$. Для бесперебойной работы службы требуется, чтобы исправными оставались не менее восьми машин. Найдите вероятность бесперебойной работы службы.","html":"\u003cp\u003eТехническая служба располагает девятью машинами. Вероятность исправной работы каждой машины равна \u003cspan class=\"math\"\u003e\\(0{,}9\\)\u003c/span\u003e. Для бесперебойной работы службы требуется, чтобы исправными оставались не менее восьми машин. Найдите вероятность бесперебойной работы службы.\u003c/p\u003e\n","text":"Техническая служба располагает девятью машинами. Вероятность исправной работы каждой машины равна $0{,}9$. Для бесперебойной работы службы требуется, чтобы исправными оставались не менее восьми машин. Найдите вероятность бесперебойной работы службы."},{"id":"naumov-v3-5","no":5,"source":"Слитая КР Наумова: Вариант 3","group":"Вариант 3","raw":"Имеется 10 винтовок, из которых четыре снабжены прицелом, а шесть — без прицела. Вероятность попадания в цель из винтовки с прицелом равна $0{,}95$, без прицела — $0{,}8$. Одну винтовку выбирают наугад и стреляют. Известно, что произошло попадание в цель. Найдите вероятность того, что стреляли из винтовки без прицела.","html":"\u003cp\u003eИмеется 10 винтовок, из которых четыре снабжены прицелом, а шесть — без прицела. Вероятность попадания в цель из винтовки с прицелом равна \u003cspan class=\"math\"\u003e\\(0{,}95\\)\u003c/span\u003e, без прицела — \u003cspan class=\"math\"\u003e\\(0{,}8\\)\u003c/span\u003e. Одну винтовку выбирают наугад и стреляют. Известно, что произошло попадание в цель. Найдите вероятность того, что стреляли из винтовки без прицела.\u003c/p\u003e\n","text":"Имеется 10 винтовок, из которых четыре снабжены прицелом, а шесть — без прицела. Вероятность попадания в цель из винтовки с прицелом равна $0{,}95$, без прицела — $0{,}8$. Одну винтовку выбирают наугад и стреляют. Известно, что произошло попадание в цель. Найдите вероятность того, что стреляли из винтовки без прицела."},{"id":"naumov-v4-1","no":1,"source":"Слитая КР Наумова: Вариант 4","group":"Вариант 4","raw":"Верно ли, что $P(A+B)\\le\\frac13$, если $P(A)=\\frac17$ и $P(B)=\\frac4{21}$?","html":"\u003cp\u003eВерно ли, что \u003cspan class=\"math\"\u003e\\(P(A+B)\\le\\frac13\\)\u003c/span\u003e, если \u003cspan class=\"math\"\u003e\\(P(A)=\\frac17\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(P(B)=\\frac4{21}\\)\u003c/span\u003e?\u003c/p\u003e\n","text":"Верно ли, что $P(A+B)\\le\\frac13$, если $P(A)=\\frac17$ и $P(B)=\\frac4{21}$?"},{"id":"naumov-v4-2","no":2,"source":"Слитая КР Наумова: Вариант 4","group":"Вариант 4","raw":"Восемь юношей, в том числе двое братьев, наугад рассаживаются с двух противоположных сторон прямоугольного стола — по четыре человека с каждой стороны. Какова вероятность того, что братья окажутся с одной стороны стола?","html":"\u003cp\u003eВосемь юношей, в том числе двое братьев, наугад рассаживаются с двух противоположных сторон прямоугольного стола — по четыре человека с каждой стороны. Какова вероятность того, что братья окажутся с одной стороны стола?\u003c/p\u003e\n","text":"Восемь юношей, в том числе двое братьев, наугад рассаживаются с двух противоположных сторон прямоугольного стола — по четыре человека с каждой стороны. Какова вероятность того, что братья окажутся с одной стороны стола?"},{"id":"naumov-v4-3","no":3,"source":"Слитая КР Наумова: Вариант 4","group":"Вариант 4","raw":"Пусть $H_1,\\ldots,H_5$ — гипотезы. Найдите $P(H_1H_2H_3)$.","html":"\u003cp\u003eПусть \u003cspan class=\"math\"\u003e\\(H_1,\\ldots,H_5\\)\u003c/span\u003e — гипотезы. Найдите \u003cspan class=\"math\"\u003e\\(P(H_1H_2H_3)\\)\u003c/span\u003e.\u003c/p\u003e\n","text":"Пусть $H_1,\\ldots,H_5$ — гипотезы. Найдите $P(H_1H_2H_3)$."},{"id":"naumov-v4-4","no":4,"source":"Слитая КР Наумова: Вариант 4","group":"Вариант 4","raw":"Вероятность улучшить предыдущий результат за одну попытку для данного спортсмена равна $p$. Найдите вероятность того, что на соревнованиях спортсмен улучшит свой результат, если разрешается сделать две попытки.","html":"\u003cp\u003eВероятность улучшить предыдущий результат за одну попытку для данного спортсмена равна \u003cspan class=\"math\"\u003e\\(p\\)\u003c/span\u003e. Найдите вероятность того, что на соревнованиях спортсмен улучшит свой результат, если разрешается сделать две попытки.\u003c/p\u003e\n","text":"Вероятность улучшить предыдущий результат за одну попытку для данного спортсмена равна $p$. Найдите вероятность того, что на соревнованиях спортсмен улучшит свой результат, если разрешается сделать две попытки."},{"id":"naumov-v4-5","no":5,"source":"Слитая КР Наумова: Вариант 4","group":"Вариант 4","raw":"Среди наблюдаемых спиральных галактик $54\\%$ относятся к типу $S_A$, а $46\\%$ — к типу $S_B$. Вероятность вспышки сверхновой звезды в течение года составляет $0{,}0045$ для галактики типа $S_A$ и $0{,}0055$ для галактики типа $S_B$. Найдите вероятность вспышки сверхновой звезды в течение года в далёкой спиральной галактике, тип которой определить не удаётся.","html":"\u003cp\u003eСреди наблюдаемых спиральных галактик \u003cspan class=\"math\"\u003e\\(54\\%\\)\u003c/span\u003e относятся к типу \u003cspan class=\"math\"\u003e\\(S_A\\)\u003c/span\u003e, а \u003cspan class=\"math\"\u003e\\(46\\%\\)\u003c/span\u003e — к типу \u003cspan class=\"math\"\u003e\\(S_B\\)\u003c/span\u003e. Вероятность вспышки сверхновой звезды в течение года составляет \u003cspan class=\"math\"\u003e\\(0{,}0045\\)\u003c/span\u003e для галактики типа \u003cspan class=\"math\"\u003e\\(S_A\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(0{,}0055\\)\u003c/span\u003e для галактики типа \u003cspan class=\"math\"\u003e\\(S_B\\)\u003c/span\u003e. Найдите вероятность вспышки сверхновой звезды в течение года в далёкой спиральной галактике, тип которой определить не удаётся.\u003c/p\u003e\n","text":"Среди наблюдаемых спиральных галактик $54\\%$ относятся к типу $S_A$, а $46\\%$ — к типу $S_B$. Вероятность вспышки сверхновой звезды в течение года составляет $0{,}0045$ для галактики типа $S_A$ и $0{,}0055$ для галактики типа $S_B$. Найдите вероятность вспышки сверхновой звезды в течение года в далёкой спиральной галактике, тип которой определить не удаётся."}]}</script>
  <script id="theory-data" type="application/json">[{"id":"theory-1","title":"§1–2. События и подсчёт вероятностей","items":[{"title":"Операции над событиями","body":"\u003cdiv class=\"math\"\u003e$$\nA+B=A\\cup B,\\qquad AB=A\\cap B,\\qquad \\overline A=\\Omega\\setminus A.\n$$\u003c/div\u003e\n\u003cdiv class=\"math\"\u003e$$\n\\overline{A+B}=\\overline A\\,\\overline B,\\qquad \\overline{AB}=\\overline A+\\overline B.\n$$\u003c/div\u003e\n\u003cp\u003eСобытия несовместны, если \u003cspan class=\"math\"\u003e\\(AB=\\varnothing\\)\u003c/span\u003e. \u003cstrong\u003eКогда использовать:\u003c/strong\u003e объединение, пересечение, отрицание событий и проверка несовместности.\u003c/p\u003e","search":"$$\nA+B=A\\cup B,\\qquad AB=A\\cap B,\\qquad \\overline A=\\Omega\\setminus A.\n$$ $$\n\\overline{A+B}=\\overline A\\,\\overline B,\\qquad \\overline{AB}=\\overline A+\\overline B.\n$$ События несовместны, если \\(AB=\\varnothing\\) . Когда использовать: объединение, пересечение, отрицание событий и проверка несовместности."},{"title":"Классическая вероятность","body":"\u003cdiv class=\"math\"\u003e$$\n\\boxed{P(A)=\\frac{m}{N}}\n$$\u003c/div\u003e\n\u003cp\u003e\u003cspan class=\"math\"\u003e\\(N\\)\u003c/span\u003e — число равновероятных исходов; \u003cspan class=\"math\"\u003e\\(m\\)\u003c/span\u003e — число благоприятных исходов. \u003cstrong\u003eКогда использовать:\u003c/strong\u003e случайный выбор, расстановка, карты, буквы и игральные кости.\u003c/p\u003e","search":"$$\n\\boxed{P(A)=\\frac{m}{N}}\n$$ \\(N\\) — число равновероятных исходов; \\(m\\) — число благоприятных исходов. Когда использовать: случайный выбор, расстановка, карты, буквы и игральные кости."},{"title":"Перестановки, размещения и сочетания","body":"\u003cdiv class=\"math\"\u003e$$\nP_n=n!,\\qquad A_n^k=\\frac{n!}{(n-k)!},\\qquad C_n^k=\\binom nk=\\frac{n!}{k!(n-k)!}.\n$$\u003c/div\u003e\n\u003cdiv class=\"math\"\u003e$$\nN_{\\text{с возвращением}}=n^k.\n$$\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eКогда использовать:\u003c/strong\u003e \u003cspan class=\"math\"\u003e\\(P_n\\)\u003c/span\u003e — расставить все предметы; \u003cspan class=\"math\"\u003e\\(A_n^k\\)\u003c/span\u003e — выбрать \u003cspan class=\"math\"\u003e\\(k\\)\u003c/span\u003e из \u003cspan class=\"math\"\u003e\\(n\\)\u003c/span\u003e, учитывая порядок; \u003cspan class=\"math\"\u003e\\(C_n^k\\)\u003c/span\u003e — выбрать без учёта порядка; \u003cspan class=\"math\"\u003e\\(n^k\\)\u003c/span\u003e — \u003cspan class=\"math\"\u003e\\(k\\)\u003c/span\u003e независимых выборов с возвращением.\u003c/p\u003e","search":"$$\nP_n=n!,\\qquad A_n^k=\\frac{n!}{(n-k)!},\\qquad C_n^k=\\binom nk=\\frac{n!}{k!(n-k)!}.\n$$ $$\nN_{\\text{с возвращением}}=n^k.\n$$ Когда использовать: \\(P_n\\) — расставить все предметы; \\(A_n^k\\) — выбрать \\(k\\) из \\(n\\) , учитывая порядок; \\(C_n^k\\) — выбрать без учёта порядка; \\(n^k\\) — \\(k\\) независимых выборов с возвращением."},{"title":"Противоположное событие","body":"\u003cdiv class=\"math\"\u003e$$\n\\boxed{P(\\overline A)=1-P(A)}\n$$\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eКогда использовать:\u003c/strong\u003e вместо «хотя бы один успех» проще вычислить вероятность отсутствия успехов.\u003c/p\u003e","search":"$$\n\\boxed{P(\\overline A)=1-P(A)}\n$$ Когда использовать: вместо «хотя бы один успех» проще вычислить вероятность отсутствия успехов."},{"title":"Сложение вероятностей","body":"\u003cdiv class=\"math\"\u003e$$\n\\boxed{P(A+B)=P(A)+P(B)-P(AB)}\n$$\u003c/div\u003e\n\u003cdiv class=\"math\"\u003e$$\nAB=\\varnothing\\quad\\Longrightarrow\\quad P(A+B)=P(A)+P(B).\n$$\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eКогда использовать:\u003c/strong\u003e событие «\u003cstrong\u003eA или B\u003c/strong\u003e», в том числе сравнение вероятностей для независимых и несовместных событий.\u003c/p\u003e","search":"$$\n\\boxed{P(A+B)=P(A)+P(B)-P(AB)}\n$$ $$\nAB=\\varnothing\\quad\\Longrightarrow\\quad P(A+B)=P(A)+P(B).\n$$ Когда использовать: событие « A или B », в том числе сравнение вероятностей для независимых и несовместных событий."},{"title":"Условная вероятность","body":"\u003cdiv class=\"math\"\u003e$$\n\\boxed{P(A\\mid B)=\\frac{P(AB)}{P(B)}},\\qquad P(B)\u003e0.\n$$\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eКогда использовать:\u003c/strong\u003e известно, что событие \u003cspan class=\"math\"\u003e\\(B\\)\u003c/span\u003e произошло; требуется уточнить вероятность события \u003cspan class=\"math\"\u003e\\(A\\)\u003c/span\u003e.\u003c/p\u003e","search":"$$\n\\boxed{P(A\\mid B)=\\frac{P(AB)}{P(B)}},\\qquad P(B)\u003e0.\n$$ Когда использовать: известно, что событие \\(B\\) произошло; требуется уточнить вероятность события \\(A\\) ."},{"title":"Система гипотез","body":"\u003cdiv class=\"math\"\u003e$$\nH_iH_j=\\varnothing\\ (i\\ne j),\\qquad \\sum_{i=1}^{n}P(H_i)=1,\\qquad P(H_i)\u003e0.\n$$\u003c/div\u003e\n\u003cp\u003eПри этом \u003cspan class=\"math\"\u003e\\(H_1+\\cdots+H_n=\\Omega\\)\u003c/span\u003e. \u003cstrong\u003eКогда использовать:\u003c/strong\u003e нужно составить или проверить систему гипотез, а также перед применением формул полной вероятности и Байеса.\u003c/p\u003e","search":"$$\nH_iH_j=\\varnothing\\ (i\\ne j),\\qquad \\sum_{i=1}^{n}P(H_i)=1,\\qquad P(H_i)\u003e0.\n$$ При этом \\(H_1+\\cdots+H_n=\\Omega\\) . Когда использовать: нужно составить или проверить систему гипотез, а также перед применением формул полной вероятности и Байеса."}],"intro":"\u003cp\u003eВ обозначениях учебника \u003cspan class=\"math\"\u003e\\(A+B\\)\u003c/span\u003e — «\u003cspan class=\"math\"\u003e\\(A\\)\u003c/span\u003e или \u003cspan class=\"math\"\u003e\\(B\\)\u003c/span\u003e», \u003cspan class=\"math\"\u003e\\(AB\\)\u003c/span\u003e — «\u003cspan class=\"math\"\u003e\\(A\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(B\\)\u003c/span\u003e», \u003cspan class=\"math\"\u003e\\(\\overline A\\)\u003c/span\u003e — «не \u003cspan class=\"math\"\u003e\\(A\\)\u003c/span\u003e».\u003c/p\u003e","search":"В обозначениях учебника \\(A+B\\) — « \\(A\\) или \\(B\\) », \\(AB\\) — « \\(A\\) и \\(B\\) », \\(\\overline A\\) — «не \\(A\\) »."},{"id":"theory-2","title":"§3. Основные формулы вычисления вероятностей","items":[{"title":"Формула умножения вероятностей","body":"\u003cdiv class=\"math\"\u003e$$\n\\boxed{P(AB)=P(A)P(B\\mid A)=P(B)P(A\\mid B)}\n$$\u003c/div\u003e\n\u003cdiv class=\"math\"\u003e$$\nP(A_1\\cdots A_n)=P(A_1)P(A_2\\mid A_1)\\cdots P(A_n\\mid A_1\\cdots A_{n-1}).\n$$\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eКогда использовать:\u003c/strong\u003e должны произойти несколько событий одновременно, особенно при последовательном выборе без возвращения.\u003c/p\u003e","search":"$$\n\\boxed{P(AB)=P(A)P(B\\mid A)=P(B)P(A\\mid B)}\n$$ $$\nP(A_1\\cdots A_n)=P(A_1)P(A_2\\mid A_1)\\cdots P(A_n\\mid A_1\\cdots A_{n-1}).\n$$ Когда использовать: должны произойти несколько событий одновременно, особенно при последовательном выборе без возвращения."},{"title":"Независимость событий","body":"\u003cdiv class=\"math\"\u003e$$\n\\boxed{A, B\\ \\text{независимы}\\ \\Longleftrightarrow\\ P(AB)=P(A)P(B)}\n$$\u003c/div\u003e\n\u003cdiv class=\"math\"\u003e$$\nP(A+B)=P(A)+P(B)-P(A)P(B)\\quad\\text{при независимости}.\n$$\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eКогда использовать:\u003c/strong\u003e проверить независимость событий или вычислить вероятность их совместного появления.\u003c/p\u003e","search":"$$\n\\boxed{A, B\\ \\text{независимы}\\ \\Longleftrightarrow\\ P(AB)=P(A)P(B)}\n$$ $$\nP(A+B)=P(A)+P(B)-P(A)P(B)\\quad\\text{при независимости}.\n$$ Когда использовать: проверить независимость событий или вычислить вероятность их совместного появления."},{"title":"Хотя бы одно из независимых событий","body":"\u003cdiv class=\"math\"\u003e$$\n\\boxed{P(A_1+\\cdots+A_n)=1-\\prod_{i=1}^{n}(1-p_i)}\n$$\u003c/div\u003e\n\u003cdiv class=\"math\"\u003e$$\np_1=\\cdots=p_n=p\\quad\\Longrightarrow\\quad P(\\text{хотя бы один})=1-(1-p)^n.\n$$\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eКогда использовать:\u003c/strong\u003e достаточно одного попадания, работающего элемента, принятого сигнала или другого успеха. Здесь события независимы.\u003c/p\u003e","search":"$$\n\\boxed{P(A_1+\\cdots+A_n)=1-\\prod_{i=1}^{n}(1-p_i)}\n$$ $$\np_1=\\cdots=p_n=p\\quad\\Longrightarrow\\quad P(\\text{хотя бы один})=1-(1-p)^n.\n$$ Когда использовать: достаточно одного попадания, работающего элемента, принятого сигнала или другого успеха. Здесь события независимы."},{"title":"Формула полной вероятности","body":"\u003cdiv class=\"math\"\u003e$$\n\\boxed{P(A)=\\sum_{i=1}^{n}P(H_i)P(A\\mid H_i)}\n$$\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eКогда использовать:\u003c/strong\u003e событие \u003cspan class=\"math\"\u003e\\(A\\)\u003c/span\u003e возможно при нескольких взаимоисключающих гипотезах \u003cspan class=\"math\"\u003e\\(H_i\\)\u003c/span\u003e: например, товар поступил из одной из фабрик.\u003c/p\u003e","search":"$$\n\\boxed{P(A)=\\sum_{i=1}^{n}P(H_i)P(A\\mid H_i)}\n$$ Когда использовать: событие \\(A\\) возможно при нескольких взаимоисключающих гипотезах \\(H_i\\) : например, товар поступил из одной из фабрик."},{"title":"Формула Байеса","body":"\u003cdiv class=\"math\"\u003e$$\n\\boxed{P(H_i\\mid A)=\\frac{P(H_i)P(A\\mid H_i)}{\\displaystyle\\sum_{j=1}^{n}P(H_j)P(A\\mid H_j)}}\n$$\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eКогда использовать:\u003c/strong\u003e исход опыта известен; требуется выяснить вероятность того, какая гипотеза была верна (откуда изделие, какой источник сигнала и т. п.).\u003c/p\u003e","search":"$$\n\\boxed{P(H_i\\mid A)=\\frac{P(H_i)P(A\\mid H_i)}{\\displaystyle\\sum_{j=1}^{n}P(H_j)P(A\\mid H_j)}}\n$$ Когда использовать: исход опыта известен; требуется выяснить вероятность того, какая гипотеза была верна (откуда изделие, какой источник сигнала и т. п.)."}],"intro":"","search":""},{"id":"theory-3","title":"Схема Бернулли","items":[{"title":"Ровно k успехов за n испытаний","body":"\u003cdiv class=\"math\"\u003e$$\n\\boxed{P_n(k)=\\binom nk p^k(1-p)^{n-k}}\n$$\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eКогда использовать:\u003c/strong\u003e \u003cspan class=\"math\"\u003e\\(n\\)\u003c/span\u003e независимых испытаний, вероятность успеха \u003cspan class=\"math\"\u003e\\(p\\)\u003c/span\u003e в каждом одинакова; требуется ровно \u003cspan class=\"math\"\u003e\\(k\\)\u003c/span\u003e успехов.\u003c/p\u003e","search":"$$\n\\boxed{P_n(k)=\\binom nk p^k(1-p)^{n-k}}\n$$ Когда использовать: \\(n\\) независимых испытаний, вероятность успеха \\(p\\) в каждом одинакова; требуется ровно \\(k\\) успехов."},{"title":"Не менее / не более k успехов","body":"\u003cdiv class=\"math\"\u003e$$\n\\begin{aligned}P(X\\le k)\u0026=\\sum_{j=0}^{k}\\binom nj p^j(1-p)^{n-j},\\\\ P(X\\ge k)\u0026=1-\\sum_{j=0}^{k-1}\\binom nj p^j(1-p)^{n-j}.\\end{aligned}\n$$\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eКогда использовать:\u003c/strong\u003e «не менее двух», «хотя бы один», «не более трёх» при одинаковой вероятности успеха.\u003c/p\u003e","search":"$$\n\\begin{aligned}P(X\\le k)\u0026=\\sum_{j=0}^{k}\\binom nj p^j(1-p)^{n-j},\\\\ P(X\\ge k)\u0026=1-\\sum_{j=0}^{k-1}\\binom nj p^j(1-p)^{n-j}.\\end{aligned}\n$$ Когда использовать: «не менее двух», «хотя бы один», «не более трёх» при одинаковой вероятности успеха."},{"title":"Наиболее вероятное число успехов","body":"\u003cdiv class=\"math\"\u003e$$\n\\begin{cases}k=\\lfloor(n+1)p\\rfloor,\u0026(n+1)p\\notin\\mathbb Z,\\\\ k\\in\\{(n+1)p-1,\\ (n+1)p\\},\u0026(n+1)p\\in\\mathbb Z.\\end{cases}\n$$\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eКогда использовать:\u003c/strong\u003e спрашивают, сколько успехов наиболее вероятно в схеме Бернулли. Предполагается \u003cspan class=\"math\"\u003e\\(0\u003cp\u003c1\\)\u003c/span\u003e.\u003c/p\u003e","search":"$$\n\\begin{cases}k=\\lfloor(n+1)p\\rfloor,\u0026(n+1)p\\notin\\mathbb Z,\\\\ k\\in\\{(n+1)p-1,\\ (n+1)p\\},\u0026(n+1)p\\in\\mathbb Z.\\end{cases}\n$$ Когда использовать: спрашивают, сколько успехов наиболее вероятно в схеме Бернулли. Предполагается \\(0 ."},{"title":"r-й успех на n-м испытании","body":"\u003cdiv class=\"math\"\u003e$$\n\\boxed{P(N=n)=\\binom{n-1}{r-1}p^r(1-p)^{n-r}},\\qquad n\\ge r.\n$$\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eКогда использовать:\u003c/strong\u003e опыты продолжаются до третьего обнаруженного нарушения, второго мальчика, третьего «герба» и т. п.\u003c/p\u003e","search":"$$\n\\boxed{P(N=n)=\\binom{n-1}{r-1}p^r(1-p)^{n-r}},\\qquad n\\ge r.\n$$ Когда использовать: опыты продолжаются до третьего обнаруженного нарушения, второго мальчика, третьего «герба» и т. п."}],"intro":"","search":""},{"id":"theory-4","title":"Формулы для специальных типов задач","items":[{"title":"Гипергеометрическая формула","body":"\u003cdiv class=\"math\"\u003e$$\n\\boxed{P(X=k)=\\frac{\\binom Kk\\binom{N-K}{n-k}}{\\binom Nn}}\n$$\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eКогда использовать:\u003c/strong\u003e из \u003cspan class=\"math\"\u003e\\(N\\)\u003c/span\u003e объектов \u003cspan class=\"math\"\u003e\\(K\\)\u003c/span\u003e обладают нужным признаком; без возвращения выбирают \u003cspan class=\"math\"\u003e\\(n\\)\u003c/span\u003e и хотят получить ровно \u003cspan class=\"math\"\u003e\\(k\\)\u003c/span\u003e таких объектов.\u003c/p\u003e","search":"$$\n\\boxed{P(X=k)=\\frac{\\binom Kk\\binom{N-K}{n-k}}{\\binom Nn}}\n$$ Когда использовать: из \\(N\\) объектов \\(K\\) обладают нужным признаком; без возвращения выбирают \\(n\\) и хотят получить ровно \\(k\\) таких объектов."},{"title":"Перестановки с повторениями","body":"\u003cdiv class=\"math\"\u003e$$\n\\boxed{\\frac{N!}{n_1!n_2!\\cdots n_s!}},\\qquad n_1+\\cdots+n_s=N.\n$$\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eКогда использовать:\u003c/strong\u003e расставляют буквы слова или другие предметы, среди которых есть неразличимые.\u003c/p\u003e","search":"$$\n\\boxed{\\frac{N!}{n_1!n_2!\\cdots n_s!}},\\qquad n_1+\\cdots+n_s=N.\n$$ Когда использовать: расставляют буквы слова или другие предметы, среди которых есть неразличимые."},{"title":"Несколько категорий в независимых испытаниях","body":"\u003cdiv class=\"math\"\u003e$$\n\\boxed{P=\\frac{n!}{k_1!\\cdots k_s!}\\,p_1^{k_1}\\cdots p_s^{k_s}}\n$$\u003c/div\u003e\n\u003cp\u003eЗдесь \u003cspan class=\"math\"\u003e\\(k_1+\\cdots+k_s=n\\)\u003c/span\u003e и \u003cspan class=\"math\"\u003e\\(p_1+\\cdots+p_s=1\\)\u003c/span\u003e. \u003cstrong\u003eКогда использовать:\u003c/strong\u003e количество результатов каждого из нескольких типов задано точно, например число единиц, двоек и троек.\u003c/p\u003e","search":"$$\n\\boxed{P=\\frac{n!}{k_1!\\cdots k_s!}\\,p_1^{k_1}\\cdots p_s^{k_s}}\n$$ Здесь \\(k_1+\\cdots+k_s=n\\) и \\(p_1+\\cdots+p_s=1\\) . Когда использовать: количество результатов каждого из нескольких типов задано точно, например число единиц, двоек и троек."},{"title":"Разные вероятности успеха в независимых испытаниях","body":"\u003cdiv class=\"math\"\u003e$$\n\\boxed{P(X=k)=\\sum_{\\substack{S\\subseteq\\{1,\\ldots,n\\}\\\\ |S|=k}}\\ \\prod_{i\\in S}p_i\\prod_{j\\notin S}(1-p_j)}\n$$\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eКогда использовать:\u003c/strong\u003e несколько независимых попыток, но вероятность успеха от попытки к попытке изменяется.\u003c/p\u003e","search":"$$\n\\boxed{P(X=k)=\\sum_{\\substack{S\\subseteq\\{1,\\ldots,n\\}\\\\ |S|=k}}\\ \\prod_{i\\in S}p_i\\prod_{j\\notin S}(1-p_j)}\n$$ Когда использовать: несколько независимых попыток, но вероятность успеха от попытки к попытке изменяется."},{"title":"Перестановки без совпадения исходных мест","body":"\u003cdiv class=\"math\"\u003e$$\n\\boxed{P(\\text{ни одного совпадения})=\\sum_{j=0}^{n}\\frac{(-1)^j}{j!}}\n$$\u003c/div\u003e\n\u003cp\u003e\u003cstrong\u003eКогда использовать:\u003c/strong\u003e письма случайно вкладывают в подписанные конверты и ни одно не должно попасть по адресу; \u003cspan class=\"math\"\u003e\\(n\\)\u003c/span\u003e различных объектов.\u003c/p\u003e","search":"$$\n\\boxed{P(\\text{ни одного совпадения})=\\sum_{j=0}^{n}\\frac{(-1)^j}{j!}}\n$$ Когда использовать: письма случайно вкладывают в подписанные конверты и ни одно не должно попасть по адресу; \\(n\\) различных объектов."}],"intro":"","search":""}]</script>
