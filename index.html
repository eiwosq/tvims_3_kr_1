      textbook: { label: 'Электронный учебник', matches: source => source.startsWith('Учебник') },
      seminars: { label: 'Семинары', matches: source => source.startsWith('Семинары') },
      leaked: { label: 'Слитые КР', matches: source => /^Слит(?:ая|ые) КР(?:\s|:)/.test(source) }
    };
    const isTaskTab = tab => Object.hasOwn(TASK_TABS, tab);
    const sourcesForTab = tab => isTaskTab(tab) ? SOURCES.filter(TASK_TABS[tab].matches) : [];
    const tasksForTab = tab => isTaskTab(tab) ? TASKS.filter(t => TASK_TABS[tab].matches(t.source)) : [];
    const STORE_KEY = 'tvims3-kr1-progress-2026-v1';
    const THEME_KEY = 'tvims3-kr1-theme-2026';
    const SOURCES_KEY = 'tvims3-kr1-sources-2026';
    const state = { tab: 'memo', query: '', status: 'all', sources: new Set(SOURCES) };
    let progress = {};
    let memoryStorage = {};
    const $ = id => document.getElementById(id);
    const escapeHtml = input => String(input ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const normalize = s => String(s ?? '').toLocaleLowerCase('ru').replace(/ё/g,'е').replace(/\s+/g,' ').trim();
    function storageGet(key) { try { return localStorage.getItem(key); } catch { return memoryStorage[key] ?? null; } }
    function storageSet(key,value) { try { localStorage.setItem(key,value); } catch { memoryStorage[key]=value; } }
    function initState() {
      try {
        const saved=JSON.parse(storageGet(STORE_KEY)||'{}');
        if (saved && typeof saved === 'object') progress=saved;
      } catch { progress={}; }
      try {
        const saved=JSON.parse(storageGet(SOURCES_KEY)||'null');
        if (Array.isArray(saved)) {
          const migrated=saved.map(s=>s.startsWith('Семинары · Семинар ')
            ? s.replace('Семинары · Семинар ', 'Семинары Игнатова · Семинар ') : s);
          state.sources=new Set(migrated.filter(s=>SOURCES.includes(s)));
        }
      } catch {}
      document.body.dataset.theme = storageGet(THEME_KEY)==='dark' ? 'dark' : 'light';
      updateThemeButton();
    }
    function updateThemeButton() { $('themeToggle').textContent=document.body.dataset.theme==='dark'?'☀️ Светлая':'🌙 Тёмная'; }
    function toggleTheme() {
      document.body.dataset.theme=document.body.dataset.theme==='dark'?'light':'dark';
      storageSet(THEME_KEY,document.body.dataset.theme); updateThemeButton();
    }
    function getStatus(id) { return ['todo','repeat','done'].includes(progress[id])?progress[id]:'todo'; }
    function statusLabel(st) { return st==='done'?'Выполнено':st==='repeat'?'Повторить':'Не выполнено'; }
    function nextStatus(st) { return st==='todo'?'repeat':st==='repeat'?'done':'todo'; }
    function setStatus(id) {
      const st=nextStatus(getStatus(id));
      if(st==='todo') delete progress[id]; else progress[id]=st;
      storageSet(STORE_KEY,JSON.stringify(progress)); render();
    }
    function saveSources() { storageSet(SOURCES_KEY,JSON.stringify([...state.sources])); }
    function sourceCount(s) { return TASKS.filter(t=>t.source===s).length; }
    function initializeSourcePicker() {
      $('sourceList').innerHTML=sourcesForTab(state.tab).map(s=>{
        const i=SOURCES.indexOf(s);
        return `<label class="source-option"><input type="checkbox" data-source-index="${i}" ${state.sources.has(s)?'checked':''}><span>${escapeHtml(s)}</span><small>${sourceCount(s)}</small></label>`;
      }).join('');
      updateSourceSummary();
    }
    function updateSourceSummary() {
      const relevant=sourcesForTab(state.tab);
      const n=relevant.filter(s=>state.sources.has(s)).length;
      $('sourceSummary').textContent=n===relevant.length?'Все источники':`Источники: ${n} из ${relevant.length}`;
      $('sourceList').querySelectorAll('[data-source-index]').forEach(el => { el.checked=state.sources.has(SOURCES[Number(el.dataset.sourceIndex)]); });
    }
    function changeSources(set) {
      const relevant=new Set(sourcesForTab(state.tab));
      state.sources=new Set([...state.sources].filter(s=>!relevant.has(s)).concat([...set]));
      saveSources(); updateSourceSummary(); render();
    }
    function taskVisible(t) {
      if (!isTaskTab(state.tab) || !TASK_TABS[state.tab].matches(t.source)) return false;
      if (!state.sources.has(t.source)) return false;
      if (state.status!=='all' && getStatus(t.id)!==state.status) return false;
      const q=normalize(state.query);
      return !q || normalize([t.no,t.source,t.raw,t.group].join(' ')).includes(q);
    }
    function renderTaskCard(t) {
      const st=getStatus(t.id);
      return `<article class="task ${st}" data-id="${escapeHtml(t.id)}">
        <div class="task-head">
          <div class="badges"><span class="badge">№${t.no}</span><span class="badge level">${escapeHtml(t.group)}</span></div>
          <button class="status ${st}" type="button" data-status="${escapeHtml(t.id)}" title="Нажмите, чтобы изменить статус">${statusLabel(st)}</button>
        </div>
        <div class="math">${t.html}</div>
        <div class="task-actions"><button class="answer-btn" type="button" data-copy="${escapeHtml(t.id)}">Скопировать условие</button></div>
      </article>`;
    }
    function renderTasks() {
      let last=null;
      const sections=[];
      for(const t of TASKS) {
        if(!taskVisible(t)) continue;
        if(last!==t.source) { sections.push({name:t.source,tasks:[]});last=t.source; }
        sections[sections.length-1].tasks.push(t);
      }
      if(!sections.length)return '<div class="empty">По выбранным условиям задач не найдено.</div>';
      return sections.map(sec=>`<section class="section"><div class="section-title"><h2>${escapeHtml(sec.name)}</h2><span class="pill">${sec.tasks.length} задач</span></div><div class="grid">${sec.tasks.map(renderTaskCard).join('')}</div></section>`).join('');
    }
    function renderTheory() {
      const q=normalize(state.query);
      const visible=THEORY_SECTIONS.map(sec=>({...sec,
        items:sec.items.filter(it=>!q || normalize([sec.title,it.title,it.search].join(' ')).includes(q)),
        introVisible:!q || normalize([sec.title,sec.search].join(' ')).includes(q)
      })).filter(sec=>sec.introVisible || sec.items.length);
      if(!visible.length)return '<div class="empty">По запросу формулы не найдены.</div>';
      const nav=visible.map(sec=>`<button class="theory-link" type="button" data-jump="${escapeHtml(sec.id)}">${escapeHtml(sec.title)}</button>`).join('');
      const sections=visible.map(sec=>`<section class="theory-section" id="${escapeHtml(sec.id)}">
        <h2>${escapeHtml(sec.title)}</h2>
        <div class="grid">
          ${sec.introVisible && sec.intro?`<article class="theory-card"><div class="formula">${sec.intro}</div></article>`:''}
          ${sec.items.map(it=>`<article class="theory-card"><h3>${escapeHtml(it.title)}</h3><div class="formula">${it.body}</div></article>`).join('')}
        </div>
      </section>`).join('');
      return `<div class="theory-layout"><aside class="theory-sidebar"><div class="theory-sidebar-title">Разделы теории</div><nav class="theory-nav" aria-label="Разделы теории">${nav}</nav></aside><div class="theory-content">${sections}</div></div>`;
    }
    function completionFor(tab) {
      const items=tasksForTab(tab);
      const done=items.filter(t=>getStatus(t.id)==='done').length;
      return {total:items.length,done,percent:items.length?Math.round(done/items.length*100):0};
    }
    function renderSectionMetric(tab, title) {
      const data=completionFor(tab);
      return `<article class="memo-card metric-card block-metric">
        <div class="memo-metric">${data.percent}%</div>
        <div class="memo-label">${title} · ${data.done} из ${data.total} выполнено</div>
        <div class="memo-progress" role="progressbar" aria-label="Выполнено: ${title}" aria-valuenow="${data.percent}" aria-valuemin="0" aria-valuemax="100">
          <span style="width:${data.percent}%"></span>
        </div>
      </article>`;
    }
    function renderMemo() {
      const done=TASKS.filter(t=>getStatus(t.id)==='done').length;
      const repeat=TASKS.filter(t=>getStatus(t.id)==='repeat').length;
      const percentage=TASKS.length?Math.round(100*done/TASKS.length):0;
      const textbook=completionFor('textbook');
      const seminars=completionFor('seminars');
      const variants=completionFor('leaked');
      return `<div class="memo-grid">
        <article class="memo-card wide purpose"><h3>О назначении</h3><p>Этот одностраничник предназначен для подготовки к контрольной работе по дисциплине 3 семестра «Теория вероятностей и математическая статистика».</p></article>
        <article class="memo-card metric-card"><div class="memo-metric">${TASKS.length}</div><div class="memo-label">задач в сборнике</div></article>
        <article class="memo-card metric-card"><div class="memo-metric">${percentage}%</div><div class="memo-label">всего выполнено: ${done} из ${TASKS.length}</div></article>
        ${renderSectionMetric('textbook','Электронный учебник')}
        ${renderSectionMetric('seminars','Семинары')}
        ${renderSectionMetric('leaked','Слитые КР')}
        <article class="memo-card"><h3>Содержание</h3><ul>
          <li><strong>Электронный учебник</strong> — ${textbook.total} задач для практики.</li>
          <li><strong>Семинары</strong> — ${seminars.total} задач с семинарских занятий.</li>
          <li><strong>Слитые КР</strong> — ${variants.total} задач из вариантов контрольных работ.</li>
          <li><strong>Теория</strong> — основные формулы и краткие пояснения к их применению. Раздел подготовлен ИИ на основе формул курса.</li>
        </ul></article>
        <article class="memo-card"><h3>Работа с задачами</h3><ul>
          <li>Можно искать задачи по условию, обозначениям или номеру.</li>
          <li>В выпадающем списке можно отметить несколько источников.</li>
          <li>Состояние задачи: <strong>Не выполнено → Повторить → Выполнено</strong>.</li>
          <li>Статусы и настройки сохраняются в браузере.</li>
        </ul></article>
        <article class="memo-card wide"><h3>Текущий результат</h3><p><strong>${done}</strong> выполнено, <strong>${repeat}</strong> требуют повторения, <strong>${TASKS.length-done-repeat}</strong> не выполнено.</p></article>
      </div>`;
    }
    function renderStats() {
      const show=isTaskTab(state.tab);
      $('stats').style.display=show?'grid':'none';
      if(!show)return;
      const current=tasksForTab(state.tab);
      const done=current.filter(t=>getStatus(t.id)==='done').length;
      const repeat=current.filter(t=>getStatus(t.id)==='repeat').length;
      $('statTotal').textContent='Всего: '+current.length;
      $('statDone').textContent='Выполнено: '+done;
      $('statRepeat').textContent='Повторить: '+repeat;
      $('statShown').textContent='Показано: '+current.filter(taskVisible).length;
      $('progressBar').style.width=(current.length ? done/current.length*100 : 0).toFixed(1)+'%';
    }
    let typeTimer=null;
    window.queueTypeset = function(root) {
      clearTimeout(typeTimer);
      typeTimer=setTimeout(()=>{
        if(window.__mathjaxReady && window.MathJax?.typesetPromise) {
          try {
            window.MathJax.typesetClear?.([root]);
            window.MathJax.typesetPromise([root]).catch(err=>console.warn('MathJax:',err));
          } catch(err) { console.warn('MathJax:',err); }
        }
      },50);
    };
    function render() {
      const isTheory=state.tab==='theory';
      const isTasks=isTaskTab(state.tab);
      document.body.classList.toggle('theory-page',isTheory);
      $('controls').classList.toggle('theory-mode',isTheory);
      $('pageTitle').classList.toggle('theory-mode',isTheory);
      document.querySelectorAll('.tab[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
      $('pageTitle').hidden=state.tab==='memo';
      $('pageTitle').textContent=isTheory?'Теория':isTasks?TASK_TABS[state.tab].label:'';
      $('controls').style.display=state.tab==='memo'?'none':'grid';
      $('statusFilter').style.display=isTasks?'':'none';
      $('sourcePicker').style.display=isTasks?'':'none';
      if(isTasks) initializeSourcePicker();
      $('content').innerHTML=isTheory?renderTheory():isTasks?renderTasks():renderMemo();
      renderStats();
      queueTypeset($('content'));
    }
    function toast(message='Условие скопировано') {
      const node=$('toast'); node.textContent=message;node.classList.add('show');
      clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.classList.remove('show'),1300);
    }
    function fallbackCopy(s) {
      const ta=document.createElement('textarea');ta.value=s;
      ta.style.cssText='position:fixed;left:-9999px';document.body.append(ta);
      ta.select();let worked=false;try{worked=document.execCommand('copy');}catch{}ta.remove();
      toast(worked?'Условие скопировано':'Не удалось скопировать');
    }
    function copyTask(id) {
      const t=TASKS.find(t=>t.id===id);if(!t)return;
      const raw=t.no+'. '+t.raw;
      if(navigator.clipboard && window.isSecureContext)
        navigator.clipboard.writeText(raw).then(()=>toast()).catch(()=>fallbackCopy(raw));
      else fallbackCopy(raw);
    }
    function listen() {
      document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{
        state.tab=btn.dataset.tab;window.scrollTo(0,0);render();
      }));
      $('themeToggle').addEventListener('click',toggleTheme);
      $('search').addEventListener('input',e=>{state.query=e.target.value;render();});
      $('statusFilter').addEventListener('change',e=>{state.status=e.target.value;render();});
      $('sourceList').addEventListener('change',e=>{
        if(!e.target.matches('[data-source-index]'))return;
        const s=SOURCES[Number(e.target.dataset.sourceIndex)];
        if(e.target.checked)state.sources.add(s);else state.sources.delete(s);
        saveSources();updateSourceSummary();render();
      });
      $('selectAllSources').addEventListener('click',()=>changeSources(new Set(sourcesForTab(state.tab))));
      $('clearSources').addEventListener('click',()=>changeSources(new Set()));
      document.addEventListener('click',e=>{
        const details=$('sourceDropdown');
        if(details.open && !details.contains(e.target)) details.open=false;
      });
      $('content').addEventListener('click',e=>{
        const status=e.target.closest('[data-status]');
        if(status){setStatus(status.dataset.status);return;}
        const copy=e.target.closest('[data-copy]');
        if(copy){copyTask(copy.dataset.copy);return;}
        const jump=e.target.closest('[data-jump]');
        if(jump){const node=$(jump.dataset.jump);if(node)node.scrollIntoView({block:'start'});}
      });
    }
    initState();initializeSourcePicker();listen();render();
  </script>
</body>
</html>
